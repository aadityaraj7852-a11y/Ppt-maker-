<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Continuous Flow PPT Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.9.0/dist/pptxgen.bundle.min.js"></script>

<style>
:root { --accent: #ffff00; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: #334155; }
body{ font-family: 'Kalam', cursive; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
.container { max-width: 1300px; margin: auto; }
.card{ background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
label{ color: #94a3b8; font-weight: 700; margin-top: 10px; display: block; }
textarea, input { 
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); 
    background: #0f172a; color: #fff; font-family: 'Kalam', cursive; margin-top: 5px; box-sizing: border-box;
}
.btn-row { display: flex; gap: 10px; margin-top: 15px; }
.btn{ flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Kalam', cursive; font-weight: 700; transition: 0.2s; }
.btn-blue{ background: #2563eb; color: #fff; }
.btn-red{ background: #e11d48; color: #fff; }
.btn-grey{ background: #475569; color: #fff; }

.preview-container { background: #000; border-radius: 10px; border: 1px solid var(--border); height: 700px; overflow-y: auto; padding: 15px; }
.slide-card { background: #0b1220; border: 1px solid #334; margin-bottom: 15px; padding: 20px; border-radius: 8px; }
[contenteditable="true"] { outline: none; transition: 0.2s; border: 1px transparent dashed; }
[contenteditable="true"]:hover { border-color: #444; }
[contenteditable="true"]:focus { background: #1e293b; color: #fff; border-color: var(--accent); }

.preview-h1 { color: var(--accent); font-weight: bold; font-size: 1.5em; margin-bottom: 8px; }
.preview-p { color: #fff; white-space: pre-wrap; font-size: 1.1em; margin-bottom: 8px; }
.preview-li { color: #ccd6f6; margin-left: 15px; display: block; }
.preview-q { color: var(--accent); font-weight: bold; margin-top: 20px; border-top: 1px solid #223; padding-top: 10px; }

.row { display: flex; flex-wrap: wrap; gap: 20px; }
.col { flex: 1; min-width: 350px; }
.margin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col card">
            <h2 style="margin:0; color:var(--accent)">PPT Perfect Flow</h2>
            <label>JSON Input</label>
            <textarea id="jsonArea" rows="12" placeholder='[{"h1":"शीर्षक", "content":"नोट्स...", "list":["बिंदु 1"]}]'></textarea>
            
            <div class="btn-row">
                <button id="importBtn" class="btn btn-grey">Import</button>
                <button id="clearBtn" class="btn btn-red">Clear</button>
            </div>

            <label>Margins</label>
            <div class="margin-grid">
                <div><label>Top</label><input type="number" id="topM" value="90"></div>
                <div><label>Bottom</label><input type="number" id="bottomM" value="70"></div>
                <div><label>Left</label><input type="number" id="leftM" value="90"></div>
                <div><label>Right</label><input type="number" id="rightM" value="90"></div>
            </div>

            <div class="margin-grid">
                <div><label>Heading/Q Color</label><input type="color" id="qColor" value="#ffff00"></div>
                <div><label>Text Color</label><input type="color" id="optColor" value="#ffffff"></div>
            </div>

            <label>Background Image</label>
            <input type="file" id="bgImg" accept="image/*">

            <button id="generateBtn" class="btn btn-blue" style="margin-top:20px; width:100%; font-size:1.2em;">Generate PPTX</button>
        </div>

        <div class="col">
            <label>Editable Preview</label>
            <div id="preview" class="preview-container"></div>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
let DATA = [];
let BG = null;

const calcCanvas = document.createElement("canvas");
const calcCtx = calcCanvas.getContext("2d");

function getWrappedHeight(text, font, maxW, lineH) {
    calcCtx.font = font;
    const words = text.split(" ");
    let line = "";
    let linesCount = 0;
    for (let w of words) {
        let t = line + w + " ";
        if (calcCtx.measureText(t).width > maxW && line !== "") {
            linesCount++;
            line = w + " ";
        } else line = t;
    }
    linesCount++; 
    return linesCount * lineH;
}

function renderPreview() {
    const box = $("preview");
    box.innerHTML = "";
    DATA.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "slide-card";
        Object.keys(item).forEach(key => {
            const el = document.createElement("div");
            el.contentEditable = "true";
            if(key === 'h1') {
                el.className = "preview-h1"; el.innerText = item.h1;
                el.onblur = (e) => DATA[idx].h1 = e.target.innerText;
                div.appendChild(el);
            } else if(key === 'content') {
                el.className = "preview-p"; el.innerText = item.content;
                el.onblur = (e) => DATA[idx].content = e.target.innerText;
                div.appendChild(el);
            } else if(key === 'list') {
                item.list.forEach((li, lIdx) => {
                    const l = document.createElement("div");
                    l.className = "preview-li"; l.contentEditable = "true";
                    l.innerText = "• " + li;
                    l.onblur = (e) => DATA[idx].list[lIdx] = e.target.innerText.replace("• ", "");
                    div.appendChild(l);
                });
            } else if(key === 'question') {
                const q = document.createElement("div");
                q.className = "preview-q"; q.contentEditable = "true";
                q.innerText = "Q: " + item.question;
                q.onblur = (e) => DATA[idx].question = e.target.innerText.replace("Q: ", "");
                div.appendChild(q);
                let opts = item.option || item.options || [];
                opts.forEach((o, oIdx) => {
                    const op = document.createElement("div");
                    op.style.marginLeft = "20px"; op.contentEditable = "true";
                    op.innerText = `${oIdx + 1}. ${o}`;
                    op.onblur = (e) => {
                        let val = e.target.innerText.replace(/^\d+\.\s*/, '');
                        if(item.option) DATA[idx].option[oIdx] = val; else DATA[idx].options[oIdx] = val;
                    };
                    div.appendChild(op);
                });
            }
        });
        box.appendChild(div);
    });
}

// Logic to keep H1, P, and List together until margin hits
async function createSlidesFromData(allData, pxW, pxH, m) {
    const finalSlides = [];
    let currentSlideLines = [];
    let currentY = m.top;
    const maxW = pxW - m.left - m.right;
    const maxY = pxH - m.bottom;

    const pushLine = (text, type) => {
        const font = (type === 'h1' || type === 'q') ? "bold 40px Kalam" : "30px Kalam";
        const lineH = (type === 'h1' || type === 'q') ? 52 : 42;
        const neededH = getWrappedHeight(text, font, maxW, lineH) + 10;

        // If hits margin, start new slide
        if (currentY + neededH > maxY && currentSlideLines.length > 0) {
            finalSlides.push([...currentSlideLines]);
            currentSlideLines = [];
            currentY = m.top;
        }
        currentSlideLines.push({ text, type, font, lineH });
        currentY += neededH;
    };

    allData.forEach(item => {
        // If it's a Quiz, flush existing notes to a slide and start Quiz on New Slide
        if (item.question) {
            if (currentSlideLines.length > 0) {
                finalSlides.push([...currentSlideLines]);
                currentSlideLines = [];
                currentY = m.top;
            }
            // Add Quiz
            pushLine("Q. " + item.question, 'q');
            let opts = item.option || item.options || [];
            opts.forEach((o, i) => pushLine(`${i+1}. ${o}`, 'o'));
            
            // Quiz always ends the slide
            finalSlides.push([...currentSlideLines]);
            currentSlideLines = [];
            currentY = m.top;
        } else {
            // Notes handling (H1, Content, List in order)
            Object.keys(item).forEach(key => {
                if(key === 'h1') pushLine(item.h1.toUpperCase(), 'h1');
                if(key === 'content') item.content.split('\n').forEach(l => pushLine(l, 'p'));
                if(key === 'list') item.list.forEach(l => pushLine("• " + l, 'li'));
            });
        }
    });

    if (currentSlideLines.length > 0) finalSlides.push(currentSlideLines);
    return finalSlides;
}

async function drawSlideImage(lines, pxW, pxH, m, qc, oc) {
    const c = document.createElement("canvas");
    c.width = pxW; c.height = pxH;
    const ctx = c.getContext("2d");
    await document.fonts.load("30px Kalam");

    if (BG) {
        let img = new Image(); img.src = BG;
        await new Promise(r => img.onload = r);
        ctx.drawImage(img, 0, 0, pxW, pxH);
    } else { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, pxW, pxH); }

    let y = m.top;
    const maxW = pxW - m.left - m.right;

    lines.forEach(line => {
        ctx.fillStyle = (line.type === 'h1' || line.type === 'q') ? qc : oc;
        ctx.font = line.font;
        const words = line.text.split(" ");
        let lineTxt = "";
        for (let w of words) {
            let t = lineTxt + w + " ";
            if (ctx.measureText(t).width > maxW && lineTxt !== "") {
                ctx.fillText(lineTxt, m.left, y); y += line.lineH; lineTxt = w + " ";
            } else lineTxt = t;
        }
        ctx.fillText(lineTxt, m.left, y);
        y += line.lineH + 10;
    });
    return c.toDataURL("image/png");
}

$('importBtn').onclick = () => {
    try {
        const raw = JSON.parse($('jsonArea').value);
        DATA = Array.isArray(raw) ? raw : [raw];
        renderPreview();
    } catch (e) { alert("Invalid JSON!"); }
};

$('generateBtn').onclick = async () => {
    if (DATA.length === 0) return alert("No Data!");
    const pxW = 1300, pxH = 710;
    const m = { top:parseInt($('topM').value), bottom:parseInt($('bottomM').value), left:parseInt($('leftM').value), right:parseInt($('rightM').value) };
    const ppt = new PptxGenJS();
    ppt.defineLayout({ name:"S", width:pxW/96, height:pxH/96 });
    ppt.layout = "S";

    // GLOBAL PROCESSOR
    const allSlides = await createSlidesFromData(DATA, pxW, pxH, m);
    
    for (const slideLines of allSlides) {
        const img = await drawSlideImage(slideLines, pxW, pxH, m, $('qColor').value, $('optColor').value);
        let s = ppt.addSlide();
        s.addImage({ data:img, x:0, y:0, w:pxW/96, h:pxH/96 });
    }
    ppt.writeFile({ fileName: "Study_Continuous.pptx" });
};

$('bgImg').onchange = (e) => {
    const reader = new FileReader();
    reader.onload = () => BG = reader.result;
    reader.readAsDataURL(e.target.files[0]);
};

$('clearBtn').onclick = () => { DATA = []; $('jsonArea').value = ""; renderPreview(); };
</script>
</body>
</html>
