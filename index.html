<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>MCQ → PPTX (Perfect Version)</title>

<link href="https://fonts.googleapis.com/css2?family=Kalam&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.9.0/dist/pptxgen.bundle.min.js"></script>

<style>
body{
  font-family:'Kalam',cursive;
  background:#0f1720;color:#eee;margin:16px;
}
.card{
  background:#121926;padding:16px;border-radius:10px;
  border:1px solid #223;max-width:1150px;margin:auto;
}
label{color:#9fb7ff;font-weight:700;margin-top:8px;display:block}
textarea,input{
  width:100%;padding:8px;border-radius:6px;
  border:1px solid #334;background:#0b1220;color:#fff;
  font-family:'Kalam',cursive;
}
.btn{
  padding:8px 12px;border:none;border-radius:8px;margin-top:10px;
  cursor:pointer;font-family:'Kalam',cursive;font-weight:700;
}
.btn-blue{background:#0b74ff;color:#fff}
.btn-grey{background:#333;color:#ccd}
.btn-red{background:#e11d48;color:#fff}

.preview{
  background:#071019;padding:12px;border-radius:8px;margin-top:10px;
  border:1px solid #203040;max-height:520px;overflow:auto;
}
.slide-preview{
  background:#000;color:#fff;padding:10px;border-radius:6px;
  margin-bottom:12px;position:relative;
}
.slide-delete{
  position:absolute;top:4px;right:4px;background:#e11d48;color:#fff;
  border:none;width:24px;height:24px;border-radius:50%;cursor:pointer;
  font-size:16px;line-height:22px;text-align:center;
}
.slide-block{
  white-space:pre-wrap;font-size:18px;line-height:1.25;padding-right:28px;
}
.slide-block[contenteditable="true"]{
  outline:1px dashed rgba(120,140,180,0.2);
  padding:6px;border-radius:4px;
}

.row{display:flex;flex-wrap:wrap;gap:12px}
.col{flex:1;min-width:300px}
</style>
</head>

<body>
<div class="card">

<h2>MCQ → PPTX (Auto Number + Background FIXED)</h2>

<div class="row">

<div class="col">

<label>JSON Input</label>
<textarea id="jsonArea" rows="8"></textarea>

<h3>Manual Entry</h3>
<label>Question</label>
<textarea id="manualQ" rows="3"></textarea>

<label>Options</label>
<input id="opt1" placeholder="Option 1">
<input id="opt2" placeholder="Option 2">
<input id="opt3" placeholder="Option 3">
<input id="opt4" placeholder="Option 4">

<button id="addManual" class="btn btn-grey">Add Question</button>

<label style="margin-top:12px">Background Image</label>
<input type="file" id="bgImg" accept="image/*">

<!-- FIXED MARGINS -->
<div class="row" style="margin-top:12px">
  <div class="col"><label>Top</label><input id="topM" value="90"></div>
  <div class="col"><label>Left</label><input id="leftM" value="90"></div>
</div>

<div class="row">
  <div class="col"><label>Right</label><input id="rightM" value="90"></div>
  <div class="col"><label>Bottom</label><input id="bottomM" value="50"></div>
</div>

<!-- FIXED SIZE 1300×710 -->
<div class="row">
  <div class="col"><label>Width</label><input id="slideW" value="1300"></div>
  <div class="col"><label>Height</label><input id="slideH" value="710"></div>
</div>

<div class="row">
  <div class="col"><label>Q Color</label><input type="color" id="qColor" value="#ffff00"></div>
  <div class="col"><label>Opt Color</label><input type="color" id="optColor" value="#ffffff"></div>
</div>

<button id="importBtn" class="btn btn-grey">Import</button>
<button id="generateBtn" class="btn btn-blue">Generate PPTX</button>
<button id="clearBtn" class="btn btn-red">Clear</button>

</div>

<!-- PREVIEW -->
<div class="col">
<label>Preview</label>
<div id="preview" class="preview"><div style="color:#7aa">Preview here…</div></div>
</div>

</div>
</div>

<<script>
  const $ = id => document.getElementById(id);

let DATA = [];
let BG = null;

// Drawing context for height calculation
const calcCanvas = document.createElement("canvas");
const calcCtx = calcCanvas.getContext("2d");

// Helper to check text height
function getWrappedHeight(text, font, maxW, lineH) {
    calcCtx.font = font;
    const words = text.split(" ");
    let line = "";
    let linesCount = 0;
    for (let w of words) {
        let t = line + w + " ";
        if (calcCtx.measureText(t).width > maxW && line !== "") {
            linesCount++;
            line = w + " ";
        } else line = t;
    }
    linesCount++; // for the last line
    return linesCount * lineH;
}

// Logic to split content based on Canvas Height
async function createSlidesFromData(item, pxW, pxH, m) {
    const slides = [];
    let currentLines = [];
    let currentY = m.top;
    const maxW = pxW - m.left - m.right;
    const maxY = pxH - m.bottom;

    const addLine = (text, type, h) => {
        const font = type === 'h1' ? "bold 45px Kalam" : (type === 'q' ? "bold 34px Kalam" : "28px Kalam");
        const lineH = type === 'h1' ? 55 : (type === 'q' ? 42 : 38);
        const neededH = getWrappedHeight(text, font, maxW, lineH) + 10;

        if (currentY + neededH > maxY && currentLines.length > 0) {
            slides.push([...currentLines]);
            currentLines = [];
            currentY = m.top;
        }
        currentLines.push({ text, type, font, lineH });
        currentY += neededH;
    };

    // 1. Process H1
    if (item.h1) addLine(item.h1.toUpperCase(), 'h1');

    // 2. Process Content/Paragraph
    if (item.content) {
        item.content.split('\n').forEach(l => addLine(l, 'p'));
    }

    // 3. Process Lists
    if (item.list) {
        item.list.forEach(l => addLine("• " + l, 'li'));
    }

    // Push notes slides
    if (currentLines.length > 0) slides.push([...currentLines]);

    // 4. Process QUIZ (Always on a NEW SLIDE)
    if (item.question) {
        let quizLines = [];
        quizLines.push({ text: "Q. " + item.question, type: 'q', font: "bold 34px Kalam", lineH: 42 });
        if (item.option) {
            item.option.forEach((o, idx) => {
                if (o) quizLines.push({ text: `${idx + 1}. ${o}`, type: 'o', font: "28px Kalam", lineH: 38 });
            });
        }
        slides.push(quizLines); // Quiz moves to its own slide
    }

    return slides;
}

// Canvas Painting
async function drawSlideImage(lines, pxW, pxH, m, qc, oc) {
    const c = document.createElement("canvas");
    c.width = pxW; c.height = pxH;
    const ctx = c.getContext("2d");

    if (BG) {
        let img = new Image(); img.src = BG;
        await new Promise(r => img.onload = r);
        ctx.drawImage(img, 0, 0, pxW, pxH);
    } else {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, pxW, pxH);
    }

    let y = m.top;
    const maxW = pxW - m.left - m.right;

    lines.forEach(line => {
        ctx.fillStyle = (line.type === 'h1' || line.type === 'q') ? qc : oc;
        ctx.font = line.font;
        y = wrapLine(ctx, line.text, m.left, y, maxW, line.lineH);
        y += 10;
    });

    return c.toDataURL("image/png");
}

function wrapLine(ctx, text, x, y, maxW, lineH) {
    const words = text.split(" ");
    let line = "";
    for (let w of words) {
        let t = line + w + " ";
        if (ctx.measureText(t).width > maxW && line !== "") {
            ctx.fillText(line, x, y); y += lineH; line = w + " ";
        } else line = t;
    }
    ctx.fillText(line, x, y);
    return y + lineH;
}

// Generate PPT
$('generateBtn').onclick = async () => {
    if (DATA.length === 0) return alert("No Data");
    
    const pxW = 1300, pxH = 710;
    const m = { 
        top: parseInt($('topM').value) || 80, 
        left: parseInt($('leftM').value) || 80, 
        right: parseInt($('rightM').value) || 80, 
        bottom: parseInt($('bottomM').value) || 50 
    };

    const ppt = new PptxGenJS();
    ppt.defineLayout({ name: "FIXED", width: pxW / 96, height: pxH / 96 });
    ppt.layout = "FIXED";

    for (let item of DATA) {
        const slideDataArray = await createSlidesFromData(item, pxW, pxH, m);
        for (let slideLines of slideDataArray) {
            const img = await drawSlideImage(slideLines, pxW, pxH, m, $('qColor').value, $('optColor').value);
            let slide = ppt.addSlide();
            slide.addImage({ data: img, x: 0, y: 0, w: pxW / 96, h: pxH / 96 });
        }
    }
    ppt.writeFile({ fileName: "Dynamic_Notes_Quiz.pptx" });
};

</script>

</body>
</html>
