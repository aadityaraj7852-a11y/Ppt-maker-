<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ultimate PPT Maker - No Table Matching (V5.2)</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Mukta:wght@400;700&family=Hind:wght@400;700&family=Amita:wght@400;700&family=Tillana:wght@400;700&family=Yatra+One&family=Sura:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.9.0/dist/pptxgen.bundle.min.js"></script>

<style>
/* --- CSS Variables & Themes --- */
:root { 
    --accent: #ffeb3b; --sub-accent: #00e676; --h3-accent: #00bcd4; --bold-color: #ff9800; --btn-blue: #2563eb; 
    --bg-main: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
    --border: #334155; --input-bg: #0b1220; --slide-bg: #000000;
}

body.light-mode {
    --accent: #d97706; --sub-accent: #16a34a; --h3-accent: #0284c7; --bold-color: #dc2626; --btn-blue: #1d4ed8;
    --bg-main: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #475569;
    --border: #cbd5e1; --input-bg: #f8fafc; --slide-bg: #ffffff;
}

body { font-family: 'Mukta', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; transition: 0.3s; }

/* Desktop Layout */
.main-wrapper { display: flex; gap: 30px; max-width: 1600px; margin: auto; align-items: flex-start; }
.left-panel { flex: 0 0 520px; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
.right-panel { flex: 1; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.1); min-height: calc(100vh - 40px); }
@media (max-width: 1050px) { .main-wrapper { flex-direction: column; } .left-panel { position: static; flex: auto; width: 100%; max-height: none; } }

.header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
.header-row h2 { margin: 0; color: var(--accent); font-size: 1.8em; }
.theme-btn { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }

label { color: var(--text-muted); font-weight: 700; margin-top: 15px; display: block; font-size: 1.05em; }
textarea, input[type="number"], select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); font-family: inherit; margin-top: 5px; box-sizing: border-box; font-size: 1.05em; }
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }
input[type="color"] { width: 100%; height: 35px; padding: 2px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; background: var(--input-bg); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 8px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
.grid-5 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 5px; }

.btn { width: 100%; padding: 10px 5px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 1em; transition: 0.2s; color: #fff; text-align: center; }
.btn:hover { opacity: 0.9; transform: translateY(-2px); }
.btn-blue { background: #2563eb; } .btn-purple { background: #8b5cf6; } .btn-red { background: #e11d48; } .btn-green { background: #10b981; } .btn-gray { background: #475569; }
.btn-generate { background: linear-gradient(135deg, #10b981, #059669); font-size: 1.3em; padding: 15px; margin-top: 20px; width: 100%; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }

.demo-btn-group { display: flex; gap: 10px; margin-top: 5px; margin-bottom: 5px;}
.demo-btn-group button { padding: 5px 10px; font-size: 0.9em; width: auto; flex: 1;}

.switch-row { display:flex; align-items:center; justify-content:space-between; background:var(--input-bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-top:15px; }
.switch-row span { font-weight:700; color:var(--text-main); font-size:0.95em; }
.switch { position: relative; display: inline-block; width: 46px; height: 24px; flex-shrink:0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider-round { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #64748b; transition: .3s; border-radius: 24px; }
.slider-round:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
.switch input:checked + .slider-round { background-color: #10b981; }
.switch input:checked + .slider-round:before { transform: translateX(22px); }

/* --- Preview Styles --- */
.preview-list { display: flex; flex-direction: column; gap: 30px; }
.slide-card { background-color: var(--slide-bg); background-size: cover !important; background-position: center !important; border: 2px solid var(--border); padding: 30px; border-radius: 8px; position: relative; aspect-ratio: 16 / 9; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4); overflow: hidden; display: flex; flex-direction: column; }
.slide-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 0; }
body.light-mode .slide-card::before { background: rgba(255, 255, 255, 0.85); }

.slide-content { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding-right: 5px; }
.slide-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-size: 1em; color: var(--text-muted); position: relative; z-index: 2; }

/* Reordering & Control Box */
.el-row { position: relative; margin-bottom: 3px; padding: 3px; border-radius: 8px; border: 1px solid transparent; transition: 0.2s; }
.el-row:hover { border-color: rgba(150,150,150,0.3); background: rgba(128,128,128,0.15); }
.el-ctrl { display: none; position: absolute; right: 5px; top: -10px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px; z-index: 10; flex-direction: row; gap: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); align-items: center; }
.el-row:hover .el-ctrl { display: flex; }
.el-ctrl button, .el-ctrl select { cursor: pointer; background: transparent; border: none; color: var(--text-main); padding: 4px 8px; font-size: 0.9em; transition: 0.2s; }
.el-ctrl button:hover { background: var(--accent); color: #000; border-radius: 4px; }
.el-ctrl select { border-left: 1px solid var(--border); margin-left: 5px; outline: none; background: var(--card-bg); color: var(--text-main); }
.margin-ctrl-grp { display: flex; align-items: center; gap: 3px; border-left: 1px solid var(--border); padding-left: 6px; margin-left: 2px;}
.margin-ctrl-grp input { width: 36px; padding: 2px 4px; height: 24px; font-size: 0.85em; text-align: center; border-radius: 4px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); margin:0;}

/* Typography Fixes */
[contenteditable="true"] { outline: none; border: 1px dashed transparent; transition: 0.2s; display: block; font-family: inherit; }
[contenteditable="true"]:hover { border-color: rgba(150,150,150,0.5); background: rgba(128,128,128,0.1); }
.p-h1 { font-size: 2.1em; font-weight: bold; margin-bottom: 5px; border-bottom: 2px solid rgba(150,150,150,0.3); padding-bottom: 5px; clear: both; }
.p-h2 { font-size: 1.5em; font-weight: bold; margin-bottom: 8px; margin-top: 10px; }
.p-h3 { font-size: 1.3em; font-weight: bold; margin-bottom: 8px; margin-top: 5px; }
.p-text, .p-li { font-size: 1.1em; margin-bottom: 6px; white-space: pre-wrap; }
.p-li-sub { font-size: 1.05em; margin-bottom: 6px; white-space: pre-wrap; margin-left: 28px; }

/* Reduced Gaps */
.p-mcq-q { font-size: 1.3em; font-weight: bold; margin-bottom: 4px; white-space: pre-wrap; }
.p-mcq-opt { font-size: 1.1em; margin-bottom: 2px; white-space: pre-wrap; padding-left: 20px; }

/* Clean Matching (No Table) Styles for Preview */
.match-wrap { margin: 10px 0; padding-left: 15px; }
.match-row { display: flex; width: 90%; margin-bottom: 6px; font-size: 1.05em; gap: 30px; align-items: flex-start; }
.match-cell { flex: 1; word-wrap: break-word; }
.match-cell:first-child { flex: 0.8; }

.preview-img { max-width: 100%; border-radius: 8px; border: 2px solid var(--border); object-fit: contain; }
.clearfix::after { content: ""; clear: both; display: table; }
</style>
</head>
<body>

<div class="main-wrapper">
    <div class="left-panel">
        <div class="header-row">
            <h2>🎓 PPT Studio Pro (V5.2)</h2>
            <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
        </div>

        <label style="margin-top: 0;">Data Input (HTML / Auto-Split / JSON)</label>
        <div class="demo-btn-group">
            <button id="demoHtmlBtn" class="btn btn-gray"><i class="fa fa-code"></i> Copy Demo HTML</button>
            <button id="demoJsonBtn" class="btn btn-gray"><i class="fa fa-brackets-curly"></i> Copy Demo JSON</button>
        </div>
        <textarea id="htmlArea" rows="4" placeholder='Paste HTML Notes, MCQ JSON, or normal text.'></textarea>
        
        <div class="grid-3" style="margin-top: 10px;">
            <button id="importBtn" class="btn btn-blue">📥 Import HTML</button>
            <button id="importJsonBtn" class="btn btn-purple">🧩 Import JSON</button>
            <button id="addSlideBtn" class="btn btn-green"><i class="fa fa-plus"></i> Add Slide</button>
        </div>
        <div class="grid-2" style="margin-top: 8px;">
            <button id="copyCodeBtn" class="btn btn-purple"><i class="fa fa-copy"></i> Copy Data</button>
            <button id="clearBtn" class="btn btn-red"><i class="fa fa-trash"></i> Clear All</button>
        </div>

        <div class="switch-row">
            <span>✅ उत्तर स्लाइड डाउनलोड में शामिल करें</span>
            <label class="switch">
                <input type="checkbox" id="includeAnswerToggle" checked>
                <span class="slider-round"></span>
            </label>
        </div>

        <label>Typography & Spacing</label>
        <div class="grid-3">
            <div>
                <label style="margin-top:5px; font-size:0.9em;">Font Style</label>
                <select id="fontFamily">
                    <option value="Mukta" selected>Mukta (Standard)</option>
                    <option value="Hind">Hind (Professional)</option>
                    <option value="Sura">Sura (Classic Book)</option>
                    <option value="Kalam">Kalam (Handwriting)</option>
                    <option value="Amita">Amita (Calligraphy)</option>
                    <option value="Tillana">Tillana (Casual Pen)</option>
                    <option value="Yatra One">Yatra One (Brush Script)</option>
                </select>
            </div>
            <div>
                <label style="margin-top:5px; font-size:0.9em;">Base Size</label>
                <input type="number" id="baseFontSize" value="28">
            </div>
            <div>
                <label style="margin-top:5px; font-size:0.9em;">Line Gap</label>
                <input type="number" id="lineSpacing" value="1.2" step="0.1">
            </div>
        </div>

        <label>Text Customization</label>
        <div class="grid-5">
            <div><label style="margin-top:5px; font-size:0.8em;">H1</label><input type="color" id="h1Color" value="#ffeb3b"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">H2</label><input type="color" id="h2Color" value="#00e676"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">H3</label><input type="color" id="h3Color" value="#00bcd4"></div>
            <div><label style="margin-top:5px; font-size:0.8em;"><b>Bold</b></label><input type="color" id="boldColor" value="#ff9800"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">Normal</label><input type="color" id="optColor" value="#ffffff"></div>
        </div>

        <label>Slide Margins (px)</label>
        <div class="grid-4">
            <div><label style="margin-top:5px; font-size:0.8em;">Top</label><input type="number" id="topM" value="90"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">Bottom</label><input type="number" id="bottomM" value="70"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">Left</label><input type="number" id="leftM" value="60"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">Right</label><input type="number" id="rightM" value="60"></div>
        </div>

        <label>Master Background Setup</label>
        <select id="bgSelect" style="margin-bottom: 10px;">
            <option value="none" selected>No Background (Solid Color)</option>
            <option value="custom">Upload Custom Background...</option>
        </select>
        <input type="file" id="bgImgUpload" accept="image/*" style="display:none;">

        <button id="generateBtn" class="btn btn-generate">💾 Generate PPTX File</button>
    </div>

    <div class="right-panel">
        <h3 style="margin-top:0; color:var(--text-main); font-size:1.6em; border-bottom:1px solid var(--border); padding-bottom:10px;">👁️ Live Slide Previews (<span id="slideCountBadge">0 Slides</span>)</h3>
        <p style="font-size: 0.9em; color: var(--text-muted); margin-bottom: 15px;">💡 <b>Update (No-Table Mode):</b> मिलान वाले सवालों में अब टेबल/बॉक्स नहीं बनेंगे, वे सीधे एकदम साफ Left-Right कॉलम में सेट हो जाएंगे!</p>
        <div id="preview" class="preview-list"></div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
let DATA = [];
let isLightMode = false;
let customBgDataUrl = null;

$('fontFamily').addEventListener('change', (e) => {
    document.body.style.fontFamily = `'${e.target.value}', sans-serif`;
    renderPreview(); saveState();
});

$('lineSpacing').addEventListener('input', () => { renderPreview(); saveState(); });
$('baseFontSize').addEventListener('input', () => { renderPreview(); saveState(); });$('includeAnswerToggle').addEventListener('change', () => { saveState(); });

function getBgUrl() { let val = $('bgSelect').value; return val === 'custom' ? customBgDataUrl : null; }

$('themeToggle').onclick = () => {
    isLightMode = !isLightMode;
    document.body.classList.toggle('light-mode', isLightMode);
    $('themeToggle').innerText = isLightMode ? "☀️ Light Mode" : "🌙 Dark Mode";
    
    if(isLightMode) {
        if($('optColor').value === "#ffffff") $('optColor').value = "#000000";
    } else {
        if($('optColor').value === "#000000") $('optColor').value = "#ffffff";
    }
    renderPreview(); saveState();
};

$('bgSelect').onchange = (e) => {$('bgImgUpload').style.display = e.target.value === 'custom' ? 'block' : 'none'; renderPreview(); saveState(); };

$('bgImgUpload').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement("canvas"); canvas.width = 1300; canvas.height = 710;
            const ctx = canvas.getContext("2d"); ctx.drawImage(img, 0, 0, 1300, 710);
            customBgDataUrl = canvas.toDataURL("image/jpeg", 0.7); 
            renderPreview(); saveState();
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
};

$('demoHtmlBtn').onclick = () => { /* unchanged */ };$('demoJsonBtn').onclick = () => { /* unchanged */ };

function decodeHtml(html) {
    if (!html) return '';
    const txt = document.createElement("textarea");
    txt.innerHTML = html;
    return txt.value;
}

function cleanHtmlForCanvas(htmlStr) {
    let str = htmlStr.replace(/<br\s*[\/]?>/gi, '\n');
    str = str.replace(/<strong[^>]*>/gi, '<b>').replace(/<\/strong>/gi, '</b>').replace(/<b\s[^>]*>/gi, '<b>');
    str = str.replace(/<\/?(?!(b)\b)[a-z](?:[^>"']|"[^"]*"|'[^']*')*>/gi, '');
    const txt = document.createElement("textarea"); txt.innerHTML = str;
    return txt.value.trim();
}

function normListItem(it) {
    if (typeof it === 'string') it = { text: it, sub: [] };
    if (!it.sub) it.sub = [];
    let t = (it.text || '').trim();
    if (t.startsWith('!')) { it.important = true; t = t.slice(1).trim(); }
    it.text = t;
    return it;
}

function extractListItems(listEl) {
    let items = [];
    Array.from(listEl.children).forEach(li => {
        if (li.tagName !== 'LI') return;
        const nested = li.querySelector('ul, ol');
        let mainText, subItems = [];
        if (nested) {
            const clone = li.cloneNode(true);
            const nestedInClone = clone.querySelector('ul, ol');
            if (nestedInClone) nestedInClone.remove();
            mainText = cleanHtmlForCanvas(clone.innerHTML);
            Array.from(nested.children).forEach(subLi => {
                if (subLi.tagName === 'LI') subItems.push(cleanHtmlForCanvas(subLi.innerHTML));
            });
        } else {
            mainText = cleanHtmlForCanvas(li.innerHTML);
        }
        items.push(normListItem({ text: mainText, sub: subItems }));
    });
    return items;
}

function parseRichContent(raw) {
    let elements = [];
    if (!raw) return elements;
    raw = decodeHtml(raw);
    
    const tableRe = /<table[\s\S]*?<\/table>/gi;
    let lastIndex = 0, m, segments = [];
    while ((m = tableRe.exec(raw)) !== null) {
        if (m.index > lastIndex) segments.push({ type: 'text', content: raw.slice(lastIndex, m.index) });
        segments.push({ type: 'table', content: m[0] });
        lastIndex = tableRe.lastIndex;
    }
    if (lastIndex < raw.length) segments.push({ type: 'text', content: raw.slice(lastIndex) });

    segments.forEach(seg => {
        if (seg.type === 'table') {
            const tdoc = new DOMParser().parseFromString(seg.content, 'text/html');
            let rows = [];
            tdoc.querySelectorAll('tr').forEach(tr => {
                let cells = [];
                tr.querySelectorAll('th, td').forEach(td => cells.push(cleanHtmlForCanvas(td.innerHTML)));
                if (cells.length > 0) rows.push(cells);
            });
            if (rows.length > 0) elements.push({ type: 'table', rows: rows });
        } else {
            let txt = seg.content.trim(); if (!txt) return;
            if (/<ul[\s>]|<ol[\s>]/i.test(txt)) {
                const wdoc = new DOMParser().parseFromString('<div>' + txt + '</div>', 'text/html');
                const root = wdoc.body.firstChild;
                Array.from(root.childNodes).forEach(node => {
                    if (node.nodeType === 1 && (node.tagName === 'UL' || node.tagName === 'OL')) {
                        let items = extractListItems(node);
                        if (items.length > 0) elements.push({ type: 'ul', items: items });
                    } else {
                        let t = cleanHtmlForCanvas(node.nodeType === 1 ? node.outerHTML : (node.textContent || ''));
                        if (t && t.trim() !== '') elements.push({ type: 'p', text: t });
                    }
                });
            } else {
                let t = cleanHtmlForCanvas(txt);
                if (t && t.trim() !== '') elements.push({ type: 'p', text: t });
            }
        }
    });
    return elements;
}

$('addSlideBtn').onclick = () => { DATA.push([{ type: 'h2', text: `Slide Title` }, { type: 'p', text: 'टेक्स्ट यहाँ लिखें...' }]); renderPreview(); saveState(); };
$('copyCodeBtn').onclick = () => navigator.clipboard.writeText(JSON.stringify(DATA, null, 2)).then(() => alert("Copied!"));

$('importBtn').onclick = () => { /* HTML logic unchanged */ };

$('importJsonBtn').onclick = () => {
    let rawJson = $('htmlArea').value.trim(); if(!rawJson) return alert("Paste JSON!");
    try {
        let jsonArr = JSON.parse(rawJson); let slidesData = []; const alphabet = ['A', 'B', 'C', 'D', 'E'];
        jsonArr.forEach((item, index) => {
            let currentSlide = [];

            if (item.question) {
                let qParts = parseRichContent(item.question); 
                let textFound = false;
                
                qParts.forEach(el => {
                    if (el.type === 'p') {
                        if(!textFound) { el.text = `Q${index + 1}. ` + el.text; textFound = true; }
                        el.type = 'mcq-q'; 
                        currentSlide.push(el);
                    } else { 
                        if (!textFound && el.type === 'table') {
                            currentSlide.push({ type: 'mcq-q', text: `Q${index + 1}.` });
                            textFound = true;
                        }
                        currentSlide.push(el); 
                    }
                });
                if (!textFound) currentSlide.push({ type: 'mcq-q', text: `Q${index + 1}.` });
            }

            if (item.table && item.table.rows && item.table.rows.length > 0) {
                let rows = item.table.headers && item.table.headers.length > 0 ? [item.table.headers, ...item.table.rows] : item.table.rows;
                currentSlide.push({ type: 'table', rows: rows });
            }

            let opts = item.option || item.options || [];
            opts.forEach((optText, i) => {
                let cleaned = cleanHtmlForCanvas(decodeHtml(optText));
                let alreadyLabeled = /^\(?[A-Ea-e][\)\.]/.test(cleaned.trim());
                let label = (!alreadyLabeled && alphabet[i]) ? alphabet[i] + ") " : "";
                currentSlide.push({ type: 'mcq-opt', text: label + cleaned }); 
            });
            
            if(item.solution || item.explanation) {
                slidesData.push(currentSlide);
                let expSlide = [
                    { type: 'meta', isAnswer: true },
                    { type: 'h3', text: `Q${index + 1}. Solution / Answer` },
                    { type: 'p', text: `Correct Answer: ${item.answer || 'N/A'}` }
                ];
                
                let expRawHtml = item.solution || item.explanation;
                let solParts = parseRichContent(expRawHtml);
                if (solParts.length > 0) solParts.forEach(el => expSlide.push(el));
                else expSlide.push({ type: 'p', text: cleanHtmlForCanvas(expRawHtml) });

                slidesData.push(expSlide);
            } else { slidesData.push(currentSlide); }
        });
        if(slidesData.length === 0) return alert("No valid JSON found.");
        DATA = slidesData; renderPreview(); saveState();
    } catch (e) { alert("Invalid JSON Format! " + e.message); }
};

$('clearBtn').onclick = () => { if(confirm("Clear all data?")) { DATA = []; $('htmlArea').value = ""; localStorage.removeItem('pptStateProV5'); renderPreview(); } };

function saveState() {
    const state = {
        data: DATA, margins: { t: $('topM').value, b:$('bottomM').value, l: $('leftM').value, r:$('rightM').value },
        fonts: { fam: $('fontFamily').value, size: $('baseFontSize').value, line:$('lineSpacing').value },
        colors: { h1: $('h1Color').value, h2: $('h2Color').value, h3:$('h3Color').value, bold: $('boldColor').value, opt:$('optColor').value },
        bg: $('bgSelect').value, theme: isLightMode, customBg: customBgDataUrl, htmlBox:$('htmlArea').value,
        includeAnswer: $('includeAnswerToggle').checked
    };
    localStorage.setItem('pptStateProV5', JSON.stringify(state));
}

function loadState() {
    const saved = localStorage.getItem('pptStateProV5');
    if(saved) {
        const state = JSON.parse(saved); DATA = state.data || []; $('htmlArea').value = state.htmlBox || "";
        $('topM').value = state.margins.t; $('bottomM').value = state.margins.b; $('leftM').value = state.margins.l; $('rightM').value = state.margins.r;
        if(state.fonts) { $('fontFamily').value = state.fonts.fam; $('baseFontSize').value = state.fonts.size; $('lineSpacing').value = state.fonts.line; document.body.style.fontFamily = `'${state.fonts.fam}', sans-serif`; }
        $('h1Color').value = state.colors.h1; $('h2Color').value = state.colors.h2; $('optColor').value = state.colors.opt; $('boldColor').value = state.colors.bold;

        $('bgSelect').value = state.bg; customBgDataUrl = state.customBg || null;
        if(state.bg === 'custom') $('bgImgUpload').style.display = 'block';
        isLightMode = state.theme || false; if(isLightMode) { document.body.classList.add('light-mode'); $('themeToggle').innerText = "☀️ Light Mode"; }
        $('includeAnswerToggle').checked = state.includeAnswer !== undefined ? state.includeAnswer : true;
        DATA.forEach(slide => slide.forEach(el => { if (el.type === 'ul' && el.items) el.items = el.items.map(normListItem); }));
    }
    renderPreview();
}

['topM', 'bottomM', 'leftM', 'rightM', 'h1Color', 'h2Color', 'h3Color', 'boldColor', 'optColor'].forEach(id => { $(id).addEventListener('change', () => { renderPreview(); saveState(); }); });

function formatPreviewText(text, boldHex) { if(!text) return ""; return text.replace(/<b>(.*?)<\/b>/g, `<span style="color:${boldHex}; font-weight:bold;">$1</span>`); }

window.moveEl = (sIdx, eIdx, dir) => {
    if (eIdx + dir < 0 || eIdx + dir >= DATA[sIdx].length) return;
    let temp = DATA[sIdx][eIdx]; DATA[sIdx][eIdx] = DATA[sIdx][eIdx + dir]; DATA[sIdx][eIdx + dir] = temp;
    saveState(); renderPreview();
};
window.delEl = (sIdx, eIdx) => { DATA[sIdx].splice(eIdx, 1); saveState(); renderPreview(); };
window.deleteSlide = (index) => { DATA.splice(index, 1); renderPreview(); saveState(); };
window.changeAlign = (sIdx, eIdx, val) => { DATA[sIdx][eIdx].align = val; saveState(); renderPreview(); };
window.updateMargin = (sIdx, eIdx, type, val) => { DATA[sIdx][eIdx][type] = parseInt(val) || 0; saveState(); renderPreview(); };
window.addTextToSlide = (sIdx) => { DATA[sIdx].push({ type: 'p', text: 'नया टेक्स्ट...' }); saveState(); renderPreview(); };

function renderPreview() {
    const box = $("preview"); box.innerHTML = "";
    $('slideCountBadge').innerText = `${DATA.length} Slides`;
    if(DATA.length === 0) { box.innerHTML = "<p style='text-align:center;'>No slides. Import HTML/JSON or click 'Add Slide'.</p>"; return; }

    const bc = $('boldColor').value, oc =$('optColor').value, bgUrl = getBgUrl();
    const bSize = parseInt($('baseFontSize').value);
    const lineGap = parseFloat($('lineSpacing').value);

    DATA.forEach((slideElements, sIdx) => {
        const div = document.createElement("div"); div.className = "slide-card";
        if(bgUrl) div.style.background = `url('${bgUrl}') center/cover no-repeat`; else div.style.backgroundColor = isLightMode ? "#ffffff" : "#000000";
        
        const headerBar = document.createElement("div"); headerBar.className = "slide-header-bar";
        const isAnsSlide = slideElements.some(el => el.type === 'meta' && el.isAnswer);
        headerBar.innerHTML = `<span><b>Slide #${sIdx + 1}</b>${isAnsSlide ? ' <i style="color:var(--sub-accent);font-weight:bold;">(Answer Slide)</i>' : ''}</span> 
            <div>
                <button class="btn btn-green" style="width:auto; padding:4px 10px; font-size:0.85em;" onclick="addTextToSlide(${sIdx})"><i class="fa fa-font"></i> Text</button>
                <button class="btn btn-blue" style="width:auto; padding:4px 10px; font-size:0.85em;" onclick="deleteSlide(${sIdx})"><i class="fa fa-trash"></i></button>
            </div>`;
        div.appendChild(headerBar);

        const contentWrap = document.createElement("div"); contentWrap.className = "slide-content clearfix";

        const appendNodeWrapper = (node, eIdx, el) => {
            const row = document.createElement("div"); row.className = "el-row";
            node.style.flex = "1";
            const ctrl = document.createElement("div"); ctrl.className = "el-ctrl";
            ctrl.innerHTML = `<button title="Move Up" onclick="moveEl(${sIdx}, ${eIdx}, -1)"><i class="fa fa-arrow-up"></i></button>
                              <button title="Move Down" onclick="moveEl(${sIdx}, ${eIdx}, 1)"><i class="fa fa-arrow-down"></i></button>
                              <button title="Delete" onclick="delEl(${sIdx}, ${eIdx})" style="color:var(--bold-color);"><i class="fa fa-trash"></i></button>`;
            row.appendChild(node); row.appendChild(ctrl); contentWrap.appendChild(row);
        };

        slideElements.forEach((el, eIdx) => {
            if (el.type === 'meta') { }
            else if (el.type === 'h1' || el.type === 'h2' || el.type === 'h3') {
                const node = document.createElement("div"); node.className = "p-" + el.type;
                node.style.color = $('h' + el.type.replace('h','') + 'Color').value;
                node.style.fontSize = (el.type==='h1' ? bSize*1.4 : (el.type==='h2' ? bSize*1.2 : bSize*1.1)) + "px";
                node.contentEditable = "true"; node.innerHTML = formatPreviewText(el.text, bc);
                node.onblur = e => { DATA[sIdx][eIdx].text = e.target.innerText; saveState(); };
                appendNodeWrapper(node, eIdx, el);
            } 
            else if (el.type === 'p' || el.type === 'mcq-q' || el.type === 'mcq-opt') {
                const node = document.createElement("div"); 
                node.className = (el.type === 'mcq-q') ? "p-mcq-q" : ((el.type === 'mcq-opt') ? "p-mcq-opt" : "p-text");
                node.style.color = (el.type === 'mcq-q') ? $('h1Color').value : oc;
                node.style.fontSize = (el.type === 'mcq-q' ? bSize*1.05 : bSize) + "px";
                node.style.lineHeight = lineGap;
                node.contentEditable = "true"; node.innerHTML = formatPreviewText(el.text, bc);
                node.onblur = e => { DATA[sIdx][eIdx].text = e.target.innerText; saveState(); };
                appendNodeWrapper(node, eIdx, el);
            }
            else if (el.type === 'table') {
                // Completely removed HTML Table, using Flex Rows for clean left/right layout
                const matchWrap = document.createElement("div"); matchWrap.className = "match-wrap";
                
                el.rows.forEach((row, rIdx) => {
                    const rowDiv = document.createElement("div");
                    rowDiv.className = "match-row";
                    
                    row.forEach((cell, cIdx) => {
                        const cellDiv = document.createElement("div");
                        cellDiv.className = "match-cell";
                        
                        let isBold = (rIdx === 0 && !cell.includes('<b>')) ? `<b>${cell}</b>` : cell;
                        cellDiv.style.color = (rIdx === 0) ? $('h1Color').value : oc;
                        
                        cellDiv.contentEditable = "true";
                        cellDiv.innerHTML = formatPreviewText(isBold, bc);
                        cellDiv.onblur = e => { DATA[sIdx][eIdx].rows[rIdx][cIdx] = e.target.innerText; saveState(); };
                        rowDiv.appendChild(cellDiv);
                    });
                    matchWrap.appendChild(rowDiv);
                });
                appendNodeWrapper(matchWrap, eIdx, el);
            }
        });
        div.appendChild(contentWrap); box.appendChild(div);
    });
}

// ==============================================
// ADVANCED GENERATOR 
// ==============================================
$('generateBtn').onclick = async () => {
    if (DATA.length === 0) return alert("No Data! Please import HTML or JSON first.");

    const includeAnswer = $('includeAnswerToggle').checked;
    const slidesToRender = DATA.filter(slideElements => includeAnswer || !slideElements.some(el => el.type === 'meta' && el.isAnswer));

    const btn = $('generateBtn'); btn.innerHTML = "⏳ Generating PPTX..."; btn.disabled = true;

    setTimeout(async () => {
        const pxW = 1300, pxH = 710;
        const m = { top:parseInt($('topM').value), bottom:parseInt($('bottomM').value), left:parseInt($('leftM').value), right:parseInt($('rightM').value) };
        const ppt = new PptxGenJS(); ppt.defineLayout({ name:"S", width:pxW/96, height:pxH/96 }); ppt.layout = "S";

        let bgUrl = getBgUrl();
        const fontFam = $('fontFamily').value;
        const bSize = parseInt($('baseFontSize').value);
        const lineMult = parseFloat($('lineSpacing').value);
        
        await document.fonts.load(`bold ${bSize}px '${fontFam}'`);
        await document.fonts.load(`normal ${bSize}px '${fontFam}'`);

        const colors = { h1: $('h1Color').value, h2: $('h2Color').value, h3:$('h3Color').value, b: $('boldColor').value, n:$('optColor').value };

        for (const slideElements of slidesToRender) {
            let s = ppt.addSlide();
            if (bgUrl) s.background = { data: bgUrl }; else s.background = { color: isLightMode ? "FFFFFF" : "000000" };

            let c = document.createElement("canvas"); c.width = pxW; c.height = pxH; 
            let ctx = c.getContext("2d"); ctx.textBaseline = "top"; 
            
            let y = m.top; const bottomLimit = pxH - m.bottom;

            const triggerPagination = () => {
                s.addImage({ data:c.toDataURL("image/png"), x:0, y:0, w:pxW/96, h:pxH/96 });
                s = ppt.addSlide();
                if (bgUrl) s.background = { data: bgUrl }; else s.background = { color: isLightMode ? "FFFFFF" : "000000" };
                c = document.createElement("canvas"); c.width = pxW; c.height = pxH;
                ctx = c.getContext("2d"); ctx.textBaseline = "top";
                y = m.top;
            };

            const drawSmartText = (text, normalFont, boldFont, normalCol, boldCol, fontSize, leftIndent = 0, rightOverride = null) => {
                if(!text) return;
                const lineH = fontSize * lineMult;
                const paras = text.split("\n");

                paras.forEach(para => {
                    if(!para.trim()) { y += lineH/2; return; }
                    let parts = para.split(/(<b>.*?<\/b>)/g); let words = [];
                    parts.forEach(part => {
                        if(part.startsWith('<b>') && part.endsWith('</b>')) part.slice(3, -4).split(' ').forEach(w => { if(w) words.push({t: w, b: true}); });
                        else part.split(' ').forEach(w => { if(w) words.push({t: w, b: false}); });
                    });
                    
                    if (y + lineH > bottomLimit && y > m.top) triggerPagination();
                    
                    let dynStartX = m.left + leftIndent; 
                    let dynEndX = rightOverride !== null ? rightOverride : (pxW - m.right);
                    let currentX = dynStartX;

                    for(let i=0; i<words.length; i++) {
                        let w = words[i]; ctx.font = w.b ? boldFont : normalFont; ctx.fillStyle = w.b ? boldCol : normalCol;
                        let metric = ctx.measureText(w.t + " ");
                        
                        if (currentX + metric.width > dynEndX && currentX !== dynStartX) { 
                            y += lineH; 
                            if (y + lineH > bottomLimit && y > m.top) triggerPagination();
                            currentX = dynStartX;
                        }
                        ctx.fillText(w.t + " ", currentX, y); currentX += metric.width;
                    }
                    y += lineH;
                });
            };

            slideElements.forEach((el) => {
                if (el.type === 'meta') { }
                else if (el.type === 'h1' || el.type === 'h2' || el.type === 'h3') {
                    let sz = el.type === 'h1' ? bSize*1.5 : (el.type === 'h2' ? bSize*1.2 : bSize*1.1);
                    drawSmartText(el.text, `bold ${sz}px '${fontFam}'`, `bold ${sz}px '${fontFam}'`, colors[el.type], colors[el.type], sz); y+=10;
                }
                else if (el.type === 'p' || el.type === 'mcq-q' || el.type === 'mcq-opt') {
                    let sz = el.type === 'mcq-q' ? bSize*1.05 : bSize; 
                    let tc = el.type === 'mcq-q' ? colors.h1 : colors.n;
                    drawSmartText(el.text, `normal ${sz}px '${fontFam}'`, `bold ${sz}px '${fontFam}'`, tc, colors.b, sz);
                    
                    if (el.type === 'mcq-q') y += 2; 
                    else if (el.type === 'mcq-opt') y += 0; 
                    else y += 4;
                }
                else if (el.type === 'table') {
                    // COMPLETELY NEW LOGIC: Renders as Text Left and Right (No AddTable)
                    y += 8; 
                    
                    el.rows.forEach((row, rIdx) => {
                        // Pre-check for pagination so both columns stay on same slide
                        let maxLines = 1;
                        row.forEach(c => maxLines = Math.max(maxLines, Math.ceil(c.replace(/<b>|<\/b>/g, '').length / 25)));
                        let estHeight = maxLines * (bSize * lineMult);
                        
                        if (y + estHeight > bottomLimit && y > m.top) {
                            triggerPagination();
                        }
                        
                        let rowStartY = y;
                        let maxRowY = y;
                        
                        row.forEach((cell, cIdx) => {
                            y = rowStartY; // Reset Y for every cell in this row so they stay parallel
                            
                            // 20px indent for Column 1, start halfway for Column 2
                            let indent = cIdx === 0 ? 20 : 450; 
                            // Stop Column 1 at the middle so it doesn't overlap Column 2
                            let rightOverride = cIdx === 0 ? (m.left + 420) : (pxW - m.right); 
                            
                            let text = cell;
                            let textColor = colors.n;
                            
                            // Make Header Row bold and highlight color
                            if (rIdx === 0) {
                                textColor = colors.h1;
                                if (!text.includes('<b>')) text = `<b>${text}</b>`; 
                            }
                            
                            drawSmartText(text, `normal ${bSize*0.95}px '${fontFam}'`, `bold ${bSize*0.95}px '${fontFam}'`, textColor, colors.b, bSize*0.95, indent, rightOverride);
                            
                            if (y > maxRowY) maxRowY = y; // Record the tallest column
                        });
                        
                        y = maxRowY + 4; // Move below the tallest column with a small gap
                    });
                    y += 10; 
                }
            });

            s.addImage({ data:c.toDataURL("image/png"), x:0, y:0, w:pxW/96, h:pxH/96 });
        }
        
        ppt.writeFile({ fileName: "Study_Notes_Pro_V5.2.pptx" }).then(() => { btn.innerHTML = "✅ Download Successful!"; setTimeout(()=>btn.innerHTML="💾 Generate PPTX File", 3000); btn.disabled = false; });
    }, 100);
};

window.onload = () => loadState();
</script>
