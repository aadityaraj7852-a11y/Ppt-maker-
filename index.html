<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Smart PPTX Maker (Notes + Quiz)</title>

<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.9.0/dist/pptxgen.bundle.min.js"></script>

<style>
:root { --accent: #0b74ff; --bg: #0f1720; --card: #161f2c; --text: #eee; }
body{ font-family:'Kalam', cursive; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
.container { max-width: 1200px; margin: auto; }
.header { text-align: center; margin-bottom: 20px; color: var(--accent); }
.card{ background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #223; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
label{ color: #9fb7ff; font-weight: 700; margin-top: 12px; display: block; font-size: 0.9em; }
textarea, input, select{ 
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334; 
    background: #0b1220; color: #fff; font-family: inherit; margin-top: 5px; box-sizing: border-box;
}
.btn-row { display: flex; gap: 10px; margin-top: 15px; }
.btn{ 
    flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; 
    font-family: inherit; font-weight: 700; transition: 0.3s; 
}
.btn-blue{ background: var(--accent); color: #fff; }
.btn-red{ background: #e11d48; color: #fff; }
.btn-grey{ background: #334155; color: #fff; }
.btn:hover { opacity: 0.9; transform: translateY(-1px); }

.preview-container { 
    background: #071019; border-radius: 10px; border: 1px solid #203040; 
    height: 600px; overflow-y: auto; padding: 15px; 
}
.slide-card { 
    background: #000; border: 1px solid #444; margin-bottom: 15px; 
    padding: 15px; border-radius: 8px; position: relative; min-height: 100px;
}
.slide-tag { 
    position: absolute; top: 5px; right: 10px; font-size: 12px; color: var(--accent); 
}
.row { display: flex; flex-wrap: wrap; gap: 15px; }
.col { flex: 1; min-width: 300px; }
.num-input { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>Smart Notes & Quiz PPTX Generator</h1>
    </div>

    <div class="row">
        <div class="col card">
            <label>JSON Input (Notes, H1, List or Quiz)</label>
            <textarea id="jsonArea" rows="6" placeholder='[{"h1":"Title", "content":"Notes..."}, {"question":"??", "option":["A","B"]}]'></textarea>
            
            <div class="btn-row">
                <button id="importBtn" class="btn btn-grey">Import JSON</button>
                <button id="clearBtn" class="btn btn-red">Clear All</button>
            </div>

            <hr style="border:0; border-top:1px solid #334; margin:20px 0;">

            <label>Design Settings</label>
            <div class="num-input">
                <div><label>Top Margin</label><input type="number" id="topM" value="80"></div>
                <div><label>Left Margin</label><input type="number" id="leftM" value="80"></div>
                <div><label>Right Margin</label><input type="number" id="rightM" value="80"></div>
                <div><label>Bottom Margin</label><input type="number" id="bottomM" value="60"></div>
            </div>

            <div class="num-input">
                <div><label>H1/Q Color</label><input type="color" id="qColor" value="#ffff00"></div>
                <div><label>Text Color</label><input type="color" id="optColor" value="#ffffff"></div>
            </div>

            <label>Custom Background Image</label>
            <input type="file" id="bgImg" accept="image/*">

            <button id="generateBtn" class="btn btn-blue" style="margin-top:20px; font-size:1.2em;">Generate PPTX</button>
        </div>

        <div class="col">
            <label>Live Preview (Slides View)</label>
            <div id="preview" class="preview-container">
                <div style="text-align:center; color:#556;">Import JSON to see preview...</div>
            </div>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
let DATA = [];
let BG = null;

// Drawing context for height calculation
const calcCanvas = document.createElement("canvas");
const calcCtx = calcCanvas.getContext("2d");

function getWrappedHeight(text, font, maxW, lineH) {
    calcCtx.font = font;
    const words = text.split(" ");
    let line = "";
    let linesCount = 0;
    for (let w of words) {
        let t = line + w + " ";
        if (calcCtx.measureText(t).width > maxW && line !== "") {
            linesCount++;
            line = w + " ";
        } else line = t;
    }
    linesCount++; 
    return linesCount * lineH;
}

async function createSlidesFromData(item, pxW, pxH, m) {
    const slides = [];
    let currentLines = [];
    let currentY = m.top;
    const maxW = pxW - m.left - m.right;
    const maxY = pxH - m.bottom;

    const addLine = (text, type) => {
        const font = type === 'h1' ? "bold 45px Kalam" : (type === 'q' ? "bold 34px Kalam" : "28px Kalam");
        const lineH = type === 'h1' ? 55 : (type === 'q' ? 42 : 38);
        const neededH = getWrappedHeight(text, font, maxW, lineH) + 15;

        if (currentY + neededH > maxY && currentLines.length > 0) {
            slides.push([...currentLines]);
            currentLines = [];
            currentY = m.top;
        }
        currentLines.push({ text, type, font, lineH });
        currentY += neededH;
    };

    if (item.h1) addLine(item.h1.toUpperCase(), 'h1');
    if (item.content) item.content.split('\n').forEach(l => addLine(l, 'p'));
    if (item.list) item.list.forEach(l => addLine("• " + l, 'li'));
    
    if (currentLines.length > 0) slides.push([...currentLines]);

    if (item.question) {
        let quizLines = [];
        quizLines.push({ text: "Q. " + item.question, type: 'q', font: "bold 34px Kalam", lineH: 42 });
        let opts = item.option || item.options || [];
        opts.forEach((o, idx) => {
            if (o) quizLines.push({ text: `${idx + 1}. ${o}`, type: 'o', font: "28px Kalam", lineH: 38 });
        });
        slides.push(quizLines);
    }
    return slides;
}

function renderPreview() {
    const box = $("preview");
    box.innerHTML = "";
    if (DATA.length === 0) { box.innerHTML = "<div style='color:#556; text-align:center;'>No data loaded.</div>"; return; }

    DATA.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "slide-card";
        let title = item.h1 || item.question || "Slide Group " + (idx+1);
        div.innerHTML = `<span class="slide-tag">Item ${idx+1}</span><div style="color:var(--accent)">${title}</div>`;
        box.appendChild(div);
    });
}

async function drawSlideImage(lines, pxW, pxH, m, qc, oc) {
    const c = document.createElement("canvas");
    c.width = pxW; c.height = pxH;
    const ctx = c.getContext("2d");

    if (BG) {
        let img = new Image(); img.src = BG;
        await new Promise(r => img.onload = r);
        ctx.drawImage(img, 0, 0, pxW, pxH);
    } else {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, pxW, pxH);
    }

    let y = m.top;
    const maxW = pxW - m.left - m.right;

    lines.forEach(line => {
        ctx.fillStyle = (line.type === 'h1' || line.type === 'q') ? qc : oc;
        ctx.font = line.font;
        const words = line.text.split(" ");
        let currentLine = "";
        for (let w of words) {
            let t = currentLine + w + " ";
            if (ctx.measureText(t).width > maxW && currentLine !== "") {
                ctx.fillText(currentLine, m.left, y); y += line.lineH; currentLine = w + " ";
            } else currentLine = t;
        }
        ctx.fillText(currentLine, m.left, y);
        y += line.lineH + 10;
    });
    return c.toDataURL("image/png");
}

$('bgImg').onchange = (e) => {
    const reader = new FileReader();
    reader.onload = () => BG = reader.result;
    reader.readAsDataURL(e.target.files[0]);
};

$('importBtn').onclick = () => {
    try {
        const raw = JSON.parse($('jsonArea').value);
        DATA = Array.isArray(raw) ? raw : [raw];
        renderPreview();
    } catch (e) { alert("JSON Format Error! Please check your input."); }
};

$('generateBtn').onclick = async () => {
    if (DATA.length === 0) return alert("Please import data first!");
    
    const pxW = 1300, pxH = 710;
    const m = {
        top: parseInt($('topM').value),
        left: parseInt($('leftM').value),
        right: parseInt($('rightM').value),
        bottom: parseInt($('bottomM').value)
    };

    const ppt = new PptxGenJS();
    ppt.defineLayout({ name: "CUSTOM", width: pxW/96, height: pxH/96 });
    ppt.layout = "CUSTOM";

    for (const item of DATA) {
        const slidesToCreate = await createSlidesFromData(item, pxW, pxH, m);
        for (const lines of slidesToCreate) {
            const img = await drawSlideImage(lines, pxW, pxH, m, $('qColor').value, $('optColor').value);
            let slide = ppt.addSlide();
            slide.addImage({ data: img, x: 0, y: 0, w: pxW/96, h: pxH/96 });
        }
    }
    ppt.writeFile({ fileName: "Study_Presentation.pptx" });
};

$('clearBtn').onclick = () => { DATA = []; $('jsonArea').value = ""; renderPreview(); };
</script>

</body>
</html>
