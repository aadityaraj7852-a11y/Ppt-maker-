<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ultimate PPT Maker - Fixed Sequence & Tables</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.9.0/dist/pptxgen.bundle.min.js"></script>

<style>
/* --- CSS Variables & Themes --- */
:root { 
    --accent: #ffeb3b; --sub-accent: #00e676; --h3-accent: #00bcd4; --bold-color: #ff9800; --btn-blue: #2563eb; 
    --bg-main: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
    --border: #334155; --input-bg: #0b1220; --slide-bg: #000000;
}

body.light-mode {
    --accent: #d97706; --sub-accent: #16a34a; --h3-accent: #0284c7; --bold-color: #dc2626; --btn-blue: #1d4ed8;
    --bg-main: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #475569;
    --border: #cbd5e1; --input-bg: #f8fafc; --slide-bg: #ffffff;
}

body { font-family: 'Kalam', cursive; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; transition: 0.3s; }

/* Desktop Layout */
.main-wrapper { display: flex; gap: 30px; max-width: 1600px; margin: auto; align-items: flex-start; }
.left-panel { flex: 0 0 480px; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
.right-panel { flex: 1; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.1); min-height: calc(100vh - 40px); }
@media (max-width: 1050px) { .main-wrapper { flex-direction: column; } .left-panel { position: static; flex: auto; width: 100%; max-height: none; } }

.header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
.header-row h2 { margin: 0; color: var(--accent); font-size: 2em; }
.theme-btn { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Kalam'; font-weight: bold; transition: 0.3s; }

label { color: var(--text-muted); font-weight: 700; margin-top: 15px; display: block; font-size: 1.1em; }
textarea, input[type="number"], select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); font-family: 'Kalam', cursive; margin-top: 5px; box-sizing: border-box; font-size: 1.1em; }
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }
input[type="color"] { width: 100%; height: 40px; padding: 2px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; background: var(--input-bg); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
.grid-5 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 5px; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Kalam', cursive; font-weight: 700; font-size: 1.1em; transition: 0.2s; color: #fff; text-align: center; }
.btn:hover { opacity: 0.9; transform: translateY(-2px); }
.btn-blue { background: #2563eb; } .btn-red { background: #e11d48; } .btn-generate { background: linear-gradient(135deg, #10b981, #059669); font-size: 1.3em; padding: 15px; margin-top: 20px; width: 100%; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }

/* --- Preview Styles --- */
.preview-list { display: flex; flex-direction: column; gap: 30px; }
.slide-card { background-color: var(--slide-bg); background-size: cover !important; background-position: center !important; border: 2px solid var(--border); padding: 30px; border-radius: 8px; position: relative; aspect-ratio: 16 / 9; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4); overflow: hidden; display: flex; flex-direction: column; }
.slide-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 0; }
body.light-mode .slide-card::before { background: rgba(255, 255, 255, 0.85); }

.slide-content { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; }

/* Typography */
[contenteditable="true"] { outline: none; border: 1px dashed transparent; transition: 0.2s; display: block; }
[contenteditable="true"]:hover { border-color: rgba(150,150,150,0.5); background: rgba(128,128,128,0.1); }
.p-h1 { color: var(--accent); font-size: 2.2em; font-weight: bold; margin-bottom: 5px; border-bottom: 2px solid rgba(150,150,150,0.3); padding-bottom: 5px; clear: both; }
.p-h2 { color: var(--sub-accent); font-size: 1.6em; font-weight: bold; margin-bottom: 8px; margin-top: 10px; }
.p-h3 { color: var(--h3-accent); font-size: 1.4em; font-weight: bold; margin-bottom: 8px; margin-top: 5px; }
.p-text, .p-li { font-size: 1.3em; margin-bottom: 8px; line-height: 1.5; white-space: pre-wrap; color: var(--text-main); }

/* Attractive HTML Table Preview */
.preview-table-wrap { width: 100%; margin: 15px 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.preview-table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,0.3); color: var(--text-main); font-size: 1.1em; }
.preview-table th, .preview-table td { padding: 10px 15px; text-align: left; border: 1px solid rgba(150,150,150,0.3); }
.preview-table th { background: #2563eb; color: #fff; font-weight: bold; }
body.light-mode .preview-table { background: rgba(255,255,255,0.7); }
</style>
</head>
<body>

<div class="main-wrapper">
    <div class="left-panel">
        <div class="header-row">
            <h2>🎓 HTML to PPT Pro</h2>
            <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
        </div>

        <label>HTML Data Input (H2 = New Slide)</label>
        <textarea id="htmlArea" rows="8" placeholder='Paste HTML (<h2>, <h3>, <ul>, <li>, <table>, <p> etc.)...'></textarea>
        
        <div class="grid-2" style="margin-top: 15px;">
            <button id="importBtn" class="btn btn-blue" title="डेटा प्रोसेस करें">📥 Load HTML</button>
            <button id="clearBtn" class="btn btn-red" title="सब डिलीट करें">🗑️ Clear All</button>
        </div>

        <label>Slide Margins (px)</label>
        <div class="grid-4">
            <div><label style="margin-top:5px; font-size:0.9em;">Top</label><input type="number" id="topM" value="110"></div>
            <div><label style="margin-top:5px; font-size:0.9em;">Bottom</label><input type="number" id="bottomM" value="70"></div>
            <div><label style="margin-top:5px; font-size:0.9em;">Left</label><input type="number" id="leftM" value="90"></div>
            <div><label style="margin-top:5px; font-size:0.9em;">Right</label><input type="number" id="rightM" value="90"></div>
        </div>

        <label>Text Colors</label>
        <div class="grid-5">
            <div><label style="margin-top:5px; font-size:0.8em;">H1</label><input type="color" id="h1Color" value="#ffeb3b"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">H2</label><input type="color" id="h2Color" value="#00e676"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">H3</label><input type="color" id="h3Color" value="#00bcd4"></div>
            <div><label style="margin-top:5px; font-size:0.8em;"><b>Bold</b></label><input type="color" id="boldColor" value="#ff9800"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">Normal</label><input type="color" id="optColor" value="#ffffff"></div>
        </div>

        <label>Master Background Setup</label>
        <select id="bgSelect" style="margin-bottom: 10px;">
            <option value="none" selected>No Background (Solid Color)</option>
            <option value="custom">Upload Custom Background...</option>
        </select>
        <input type="file" id="bgImgUpload" accept="image/*" style="display:none;">

        <button id="generateBtn" class="btn btn-generate">💾 Generate PPTX File</button>
    </div>

    <div class="right-panel">
        <h3 style="margin-top:0; color:var(--text-main); font-size:1.8em; border-bottom:1px solid var(--border); padding-bottom:10px;">👁️ Live Slide Preview</h3>
        <div id="preview" class="preview-list"></div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
let DATA = [];
let isLightMode = false;
let customBgDataUrl = null;

function getBgUrl() { let val = $('bgSelect').value; return val === 'custom' ? customBgDataUrl : null; }

$('themeToggle').onclick = () => {
    isLightMode = !isLightMode;
    document.body.classList.toggle('light-mode', isLightMode);
    $('themeToggle').innerText = isLightMode ? "☀️ Light Mode" : "🌙 Dark Mode";
    if(isLightMode && $('optColor').value === "#ffffff") $('optColor').value = "#000000";
    else if(!isLightMode && $('optColor').value === "#000000") $('optColor').value = "#ffffff";
    renderPreview(); saveState();
};

$('bgSelect').onchange = (e) => { $('bgImgUpload').style.display = e.target.value === 'custom' ? 'block' : 'none'; renderPreview(); saveState(); };

$('bgImgUpload').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement("canvas"); canvas.width = 1300; canvas.height = 710;
            const ctx = canvas.getContext("2d"); ctx.drawImage(img, 0, 0, 1300, 710);
            customBgDataUrl = canvas.toDataURL("image/jpeg", 0.7); 
            renderPreview(); saveState();
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
};

// ==============================================
// SMART HTML PARSER (Maintains Strict Sequence)
// ==============================================
function cleanHtmlForCanvas(htmlStr) {
    let str = htmlStr.replace(/<strong[^>]*>/gi, '<b>').replace(/<\/strong>/gi, '</b>')
                     .replace(/<b\s[^>]*>/gi, '<b>').replace(/<br\s*[\/]?>/gi, '\n');
    str = str.replace(/<\/?(?!(b)\b)[a-z](?:[^>"']|"[^"]*"|'[^']*')*>/gi, '');
    const txt = document.createElement("textarea"); txt.innerHTML = str;
    return txt.value.trim();
}

$('importBtn').onclick = () => { 
    let rawHtml = $('htmlArea').value.trim();
    if(!rawHtml) return alert("Please paste HTML code!");

    let slidesData = [];
    let currentSlide = [];

    const parser = new DOMParser();
    const doc = parser.parseFromString(rawHtml, 'text/html');

    Array.from(doc.body.children).forEach(el => {
        if (el.tagName === 'H1' || el.tagName === 'H2') {
            if (currentSlide.length > 0) slidesData.push(currentSlide);
            currentSlide = [];
            currentSlide.push({ type: el.tagName.toLowerCase(), text: cleanHtmlForCanvas(el.innerHTML) });
        } 
        else if (el.tagName === 'H3') {
            currentSlide.push({ type: 'h3', text: cleanHtmlForCanvas(el.innerHTML) });
        } 
        else if (el.tagName === 'P') {
            let text = cleanHtmlForCanvas(el.innerHTML);
            if(text) currentSlide.push({ type: 'p', text: text });
        } 
        else if (el.tagName === 'UL' || el.tagName === 'OL') {
            let items = [];
            Array.from(el.children).forEach(li => { if (li.tagName === 'LI') items.push(cleanHtmlForCanvas(li.innerHTML)); });
            if(items.length > 0) currentSlide.push({ type: 'ul', items: items });
        } 
        else if (el.tagName === 'TABLE') {
            let rows = [];
            Array.from(el.querySelectorAll('tr')).forEach(tr => {
                let cells = [];
                Array.from(tr.querySelectorAll('th, td')).forEach(td => cells.push(cleanHtmlForCanvas(td.innerHTML)));
                if(cells.length > 0) rows.push(cells);
            });
            if(rows.length > 0) currentSlide.push({ type: 'table', rows: rows });
        }
    });

    if (currentSlide.length > 0) slidesData.push(currentSlide);

    if (slidesData.length === 0) return alert("No valid HTML tags found! Use <h2>, <ul>, <li>, <p>, <table> etc.");

    DATA = slidesData;
    renderPreview(); saveState();
};

$('clearBtn').onclick = () => { if(confirm("Clear all data?")) { DATA = []; $('htmlArea').value = ""; localStorage.removeItem('htmlPptStateFinalX'); renderPreview(); } };

function saveState() {
    const state = {
        data: DATA, margins: { t: $('topM').value, b: $('bottomM').value, l: $('leftM').value, r: $('rightM').value },
        colors: { h1: $('h1Color').value, h2: $('h2Color').value, h3: $('h3Color').value, bold: $('boldColor').value, opt: $('optColor').value },
        bg: $('bgSelect').value, theme: isLightMode, customBg: customBgDataUrl, htmlBox: $('htmlArea').value
    };
    localStorage.setItem('htmlPptStateFinalX', JSON.stringify(state));
}

function loadState() {
    const saved = localStorage.getItem('htmlPptStateFinalX');
    if(saved) {
        const state = JSON.parse(saved); DATA = state.data || [];
        $('htmlArea').value = state.htmlBox || "";
        $('topM').value = state.margins.t; $('bottomM').value = state.margins.b; $('leftM').value = state.margins.l; $('rightM').value = state.margins.r;
        $('h1Color').value = state.colors.h1; $('h2Color').value = state.colors.h2; 
        if(state.colors.h3) $('h3Color').value = state.colors.h3; if(state.colors.bold) $('boldColor').value = state.colors.bold;
        $('optColor').value = state.colors.opt; $('bgSelect').value = state.bg;
        customBgDataUrl = state.customBg || null;
        if(state.bg === 'custom') $('bgImgUpload').style.display = 'block';
        isLightMode = state.theme || false;
        if(isLightMode) { document.body.classList.add('light-mode'); $('themeToggle').innerText = "☀️ Light Mode"; }
    }
    renderPreview();
}

['topM', 'bottomM', 'leftM', 'rightM', 'h1Color', 'h2Color', 'h3Color', 'boldColor', 'optColor'].forEach(id => { $(id).addEventListener('change', () => { renderPreview(); saveState(); }); });

function formatPreviewText(text, boldHex) { if(!text) return ""; return text.replace(/<b>(.*?)<\/b>/g, `<span style="color:${boldHex}; font-weight:bold;">$1</span>`); }

function renderPreview() {
    const box = $("preview"); box.innerHTML = "";
    if(DATA.length === 0) { box.innerHTML = "<p style='color:var(--text-muted); padding:20px; text-align:center;'>No data. Paste HTML code and click Load.</p>"; return; }

    const h1c = $('h1Color').value, h2c = $('h2Color').value, h3c = $('h3Color').value, bc = $('boldColor').value, oc = $('optColor').value;
    const bgUrl = getBgUrl();

    DATA.forEach((slideElements, sIdx) => {
        const div = document.createElement("div"); div.className = "slide-card";
        if(bgUrl) div.style.background = `url('${bgUrl}') center/cover no-repeat`; else div.style.backgroundColor = isLightMode ? "#ffffff" : "#000000";
        const contentWrap = document.createElement("div"); contentWrap.className = "slide-content";

        slideElements.forEach((el, eIdx) => {
            if (el.type === 'h1' || el.type === 'h2' || el.type === 'h3') {
                const node = document.createElement("div"); node.className = "p-" + el.type;
                node.style.color = el.type === 'h1' ? h1c : (el.type === 'h2' ? h2c : h3c);
                node.contentEditable = "true"; node.innerHTML = formatPreviewText(el.text, bc);
                node.onblur = e => { DATA[sIdx][eIdx].text = e.target.innerText; saveState(); }; contentWrap.appendChild(node);
            } 
            else if (el.type === 'p') {
                const node = document.createElement("div"); node.className = "p-text"; node.style.color = oc;
                node.contentEditable = "true"; node.innerHTML = formatPreviewText(el.text, bc);
                node.onblur = e => { DATA[sIdx][eIdx].text = e.target.innerText; saveState(); }; contentWrap.appendChild(node);
            } 
            else if (el.type === 'ul') {
                el.items.forEach((itemText, iIdx) => {
                    const liNode = document.createElement("div"); liNode.className = "p-li"; liNode.style.color = oc;
                    liNode.contentEditable = "true"; liNode.innerHTML = "• " + formatPreviewText(itemText, bc);
                    liNode.onblur = e => { DATA[sIdx][eIdx].items[iIdx] = e.target.innerText.replace(/^•\s*/, ""); saveState(); };
                    contentWrap.appendChild(liNode);
                });
            } 
            else if (el.type === 'table') {
                const tableWrap = document.createElement("div"); tableWrap.className = "preview-table-wrap";
                const table = document.createElement("table"); table.className = "preview-table";
                el.rows.forEach((row, rIdx) => {
                    const tr = document.createElement("tr");
                    row.forEach((cell, cIdx) => {
                        const td = document.createElement(rIdx === 0 ? "th" : "td");
                        td.contentEditable = "true"; td.innerHTML = formatPreviewText(cell, bc);
                        td.onblur = e => { DATA[sIdx][eIdx].rows[rIdx][cIdx] = e.target.innerText; saveState(); }; tr.appendChild(td);
                    }); table.appendChild(tr);
                });
                tableWrap.appendChild(table); contentWrap.appendChild(tableWrap);
            }
        });
        div.appendChild(contentWrap); box.appendChild(div);
    });
}

$('generateBtn').onclick = async () => {
    if (DATA.length === 0) return alert("No Data! Please import HTML first.");
    const btn = $('generateBtn'); btn.innerHTML = "⏳ Generating PPTX..."; btn.disabled = true;

    setTimeout(async () => {
        const pxW = 1300, pxH = 710;
        const m = { top:parseInt($('topM').value), bottom:parseInt($('bottomM').value), left:parseInt($('leftM').value), right:parseInt($('rightM').value) };
        const ppt = new PptxGenJS(); ppt.defineLayout({ name:"S", width:pxW/96, height:pxH/96 }); ppt.layout = "S";

        let bgUrl = getBgUrl();
        await document.fonts.load("30px Kalam"); await document.fonts.load("bold 30px Kalam"); 
        await document.fonts.load("bold 34px Kalam"); await document.fonts.load("bold 44px Kalam");

        const h1c = $('h1Color').value, h2c = $('h2Color').value, h3c = $('h3Color').value, bc = $('boldColor').value, oc = $('optColor').value;

        for (const slideElements of DATA) {
            let s = ppt.addSlide();
            if (bgUrl) s.background = { data: bgUrl }; else s.background = { color: isLightMode ? "FFFFFF" : "000000" };

            // Transparent Canvas for Texts
            const c = document.createElement("canvas"); c.width = pxW; c.height = pxH; const ctx = c.getContext("2d"); ctx.textBaseline = "top"; 
            
            let y = m.top; const maxW = pxW - m.left - m.right;
            let tablesToRender = [];

            const drawSmartText = (text, normalFont, boldFont, normalCol, boldCol, lineH, leftIndent = 0) => {
                if(!text) return;
                const paras = text.split("\n");
                paras.forEach(para => {
                    if(!para.trim()) { y += lineH/2; return; }
                    let parts = para.split(/(<b>.*?<\/b>)/g); let words = [];
                    parts.forEach(part => {
                        if(part.startsWith('<b>') && part.endsWith('</b>')) part.slice(3, -4).split(' ').forEach(w => { if(w) words.push({t: w, b: true}); });
                        else part.split(' ').forEach(w => { if(w) words.push({t: w, b: false}); });
                    });
                    let currentX = m.left + leftIndent; let endX = pxW - m.right;
                    for(let i=0; i<words.length; i++) {
                        let w = words[i]; ctx.font = w.b ? boldFont : normalFont; ctx.fillStyle = w.b ? boldCol : normalCol;
                        let metric = ctx.measureText(w.t + " ");
                        if (currentX + metric.width > endX && currentX !== m.left + leftIndent) { y += lineH; currentX = m.left + leftIndent; }
                        ctx.fillText(w.t + " ", currentX, y); currentX += metric.width;
                    }
                    y += lineH;
                });
            };

            // Draw Texts to Canvas & Calculate Table Positions
            slideElements.forEach(el => {
                if(el.type === 'h1'){ drawSmartText(el.text, "bold 44px Kalam", "bold 44px Kalam", h1c, h1c, 56); y+=10; }
                else if(el.type === 'h2'){ drawSmartText(el.text, "bold 34px Kalam", "bold 34px Kalam", h2c, h2c, 46); y+=10; }
                else if(el.type === 'h3'){ drawSmartText(el.text, "bold 28px Kalam", "bold 28px Kalam", h3c, h3c, 38); y+=5; }
                else if(el.type === 'p'){ drawSmartText(el.text, "30px Kalam", "bold 30px Kalam", oc, bc, 42); y+=8; }
                else if(el.type === 'ul'){ el.items.forEach(li => drawSmartText("• " + li, "30px Kalam", "bold 30px Kalam", oc, bc, 42, 20)); y+=10; }
                else if(el.type === 'table'){
                    tablesToRender.push({ rows: el.rows, y: y });
                    y += (el.rows.length * 45) + 20; // Reserve space for the table
                }
            });

            // Native PptxGenJS Table for High Quality
            tablesToRender.forEach(tbl => {
                let pptRows = tbl.rows.map((rowArr, rIdx) => {
                    return rowArr.map(cellHtml => {
                        let isHead = (rIdx === 0);
                        return {
                            text: cellHtml.replace(/<b>|<\/b>/g, ''), // Remove tags for ppt table
                            options: { color: isHead ? 'FFFFFF' : (isLightMode ? '000000' : 'FFFFFF'), bold: isHead || cellHtml.includes('<b>'),
                                       fontFace: 'Kalam', fontSize: 18, fill: isHead ? '2563EB' : (isLightMode ? 'F8FAFC' : '1E293B'),
                                       align: 'center', valign: 'middle' }
                        };
                    });
                });
                s.addTable(pptRows, { x: m.left/96, y: tbl.y/96, w: maxW/96, rowH: 0.45, border: { pt: 1, color: isLightMode ? 'CBD5E1' : '475569' } });
            });

            // Add Text Canvas as Transparent Overlay
            s.addImage({ data:c.toDataURL("image/png"), x:0, y:0, w:pxW/96, h:pxH/96 });
        }
        
        ppt.writeFile({ fileName: "Study_Notes_HTML_Pro.pptx" }).then(() => { btn.innerHTML = "✅ Download Successful!"; setTimeout(()=>btn.innerHTML="💾 Generate PPTX File", 3000); btn.disabled = false; });
    }, 100);
};

window.onload = () => loadState();
</script>
</body>
</html>
