<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ultimate PPT Maker - Clean Layout</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.9.0/dist/pptxgen.bundle.min.js"></script>

<style>
/* --- CSS Variables & Themes --- */
:root { 
    --accent: #ffeb3b; --sub-accent: #00e676; --h3-accent: #00bcd4; --bold-color: #ff9800; --btn-blue: #2563eb; 
    --bg-main: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
    --border: #334155; --input-bg: #0b1220; --slide-bg: #000000;
}

body.light-mode {
    --accent: #d97706; --sub-accent: #16a34a; --h3-accent: #0284c7; --bold-color: #dc2626; --btn-blue: #1d4ed8;
    --bg-main: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #475569;
    --border: #cbd5e1; --input-bg: #f8fafc; --slide-bg: #ffffff;
}

body { font-family: 'Kalam', cursive; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; transition: 0.3s; }

/* Desktop Layout */
.main-wrapper { display: flex; gap: 30px; max-width: 1600px; margin: auto; align-items: flex-start; }
.left-panel { flex: 0 0 450px; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
.right-panel { flex: 1; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.1); min-height: calc(100vh - 40px); }
@media (max-width: 1050px) { .main-wrapper { flex-direction: column; } .left-panel { position: static; flex: auto; width: 100%; max-height: none; } }

.header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
.header-row h2 { margin: 0; color: var(--accent); font-size: 2em; }
.theme-btn { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Kalam'; font-weight: bold; transition: 0.3s; }

label { color: var(--text-muted); font-weight: 700; margin-top: 15px; display: block; font-size: 1.1em; }
textarea, input[type="number"], select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); font-family: 'Kalam', cursive; margin-top: 5px; box-sizing: border-box; font-size: 1.1em; }
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }
input[type="color"] { width: 100%; height: 40px; padding: 2px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; background: var(--input-bg); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
.grid-5 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 5px; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Kalam', cursive; font-weight: 700; font-size: 1.1em; transition: 0.2s; color: #fff; text-align: center; }
.btn:hover { opacity: 0.9; transform: translateY(-2px); }
.btn-blue { background: #2563eb; } .btn-red { background: #e11d48; } .btn-grey { background: #475569; } .btn-cyan { background: #0ea5e9; }
.btn-generate { background: linear-gradient(135deg, #10b981, #059669); font-size: 1.3em; padding: 15px; margin-top: 20px; width: 100%; }

/* --- Preview Styles --- */
.preview-list { display: flex; flex-direction: column; gap: 30px; }

.slide-card { 
    background-color: var(--slide-bg); background-size: cover !important; background-position: center !important; 
    border: 2px solid var(--border); padding: 30px; border-radius: 8px; position: relative; 
    aspect-ratio: 16 / 9; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4); overflow: hidden; 
    display: flex; flex-direction: column;
}
.slide-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 0; }
body.light-mode .slide-card::before { background: rgba(255, 255, 255, 0.85); }

.slide-content { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; }

/* Typography */
[contenteditable="true"] { outline: none; border: 1px dashed transparent; transition: 0.2s; display: block; }
[contenteditable="true"]:hover { border-color: rgba(150,150,150,0.5); background: rgba(128,128,128,0.1); }
.p-h1 { color: var(--accent); font-size: 2.2em; font-weight: bold; margin-bottom: 5px; border-bottom: 2px solid rgba(150,150,150,0.3); padding-bottom: 5px; }
.p-h2 { color: var(--sub-accent); font-size: 1.6em; font-weight: bold; margin-bottom: 8px; }
.p-h3 { color: var(--h3-accent); font-size: 1.4em; font-weight: bold; margin-bottom: 8px; }
.p-text, .p-li { font-size: 1.3em; margin-bottom: 8px; line-height: 1.5; white-space: pre-wrap; color: var(--text-main); }
.p-q { color: var(--accent); font-size: 1.6em; font-weight: bold; margin-top: 10px; }

/* H1 Continued Logic */
.h1-continued { opacity: 0.4; font-size: 1.2em; border: none; padding: 0; margin-bottom: 0px; text-decoration: line-through; }
.h1-continued::after { content: " (Continued - Hidden in final PPTX)"; font-size: 0.7em; font-style: italic; color: #ff5252; text-decoration: none;}

/* --- Simple Image Drop Area (No Floats) --- */
.image-placeholder-box { 
    border: 2px dashed rgba(150,150,150,0.5); border-radius: 8px; background: rgba(128,128,128,0.1); 
    display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: 0.3s; 
    flex: 1; /* Take remaining space at bottom */
    min-height: 150px; margin-top: 15px; width: 100%;
}
.image-placeholder-box:hover { border-color: var(--accent); background: rgba(128,128,128,0.2); }
.image-placeholder-box span { color: var(--text-muted); font-size: 1.1em; pointer-events: none; font-weight: bold; text-align: center;}
.image-placeholder-box img { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; z-index: 1; }
.remove-img-btn { position: absolute; top: 10px; right: 10px; background: #e11d48; color: white; border: none; border-radius: 5px; padding: 6px 12px; cursor: pointer; z-index: 2; font-family: 'Kalam'; font-size: 0.9em; }

</style>
</head>
<body>

<div class="main-wrapper">
    <div class="left-panel">
        <div class="header-row">
            <h2>🎓 Pro PPT Maker</h2>
            <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
        </div>

        <label>JSON Data Input</label>
        <textarea id="jsonArea" rows="6" placeholder='[{"h1":"Main", "h2":"Sub", "content":"Notes..."}]'></textarea>
        
        <div class="grid-2" style="margin-top: 15px;">
            <button id="importBtn" class="btn btn-grey" title="पुराना मिटाकर नया डालें">📥 Replace Data</button>
            <button id="appendBtn" class="btn btn-blue" title="पुरानी स्लाइड के नीचे नया जोड़ें">➕ Append JSON</button>
        </div>
        <div class="grid-2" style="margin-top: 10px;">
            <button id="copyBtn" class="btn btn-cyan" title="अपडेटेड JSON कॉपी करें">📋 Copy JSON</button>
            <button id="clearBtn" class="btn btn-red" title="सब डिलीट करें">🗑️ Clear All</button>
        </div>

        <label>Slide Margins (px)</label>
        <div class="grid-4">
            <div><label style="margin-top:5px; font-size:0.9em;">Top</label><input type="number" id="topM" value="110"></div>
            <div><label style="margin-top:5px; font-size:0.9em;">Bottom</label><input type="number" id="bottomM" value="70"></div>
            <div><label style="margin-top:5px; font-size:0.9em;">Left</label><input type="number" id="leftM" value="90"></div>
            <div><label style="margin-top:5px; font-size:0.9em;">Right</label><input type="number" id="rightM" value="90"></div>
        </div>

        <label>Text Colors</label>
        <div class="grid-5">
            <div><label style="margin-top:5px; font-size:0.8em;">H1</label><input type="color" id="h1Color" value="#ffeb3b"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">H2</label><input type="color" id="h2Color" value="#00e676"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">H3</label><input type="color" id="h3Color" value="#00bcd4"></div>
            <div><label style="margin-top:5px; font-size:0.8em;"><b>Bold</b></label><input type="color" id="boldColor" value="#ff9800"></div>
            <div><label style="margin-top:5px; font-size:0.8em;">Normal</label><input type="color" id="optColor" value="#ffffff"></div>
        </div>

        <label>Master Background Setup</label>
        <select id="bgSelect" style="margin-bottom: 10px;">
            <option value="none" selected>No Background (Solid Color)</option>
            <option value="default1">Default Image 1 (Yellow-Dark)</option>
            <option value="default2">Default Image 2 (Blue-Dark)</option>
            <option value="custom">Upload Custom Background...</option>
        </select>
        <input type="file" id="bgImgUpload" accept="image/*" style="display:none;">

        <button id="generateBtn" class="btn btn-generate">💾 Generate PPTX File</button>
    </div>

    <div class="right-panel">
        <h3 style="margin-top:0; color:var(--text-main); font-size:1.8em; border-bottom:1px solid var(--border); padding-bottom:10px;">👁️ Live Slide Preview</h3>
        <div id="preview" class="preview-list"></div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
let DATA = [];
let isLightMode = false;

// Blogger Images restored
const defaultImg1 = "https://blogger.googleusercontent.com/img/a/AVvXsEglEH5N9CdXH5F3qcRU9elRqBnLtC5_9Lhz-j_dBi9hYBCK1oBC88Vthv4uS0e5yMl2FsXPjbhxs9KLqI2Xtzs6S7FpxIRLb2PBzYUNJ5y_MnaNDQUHJE7PnnXlFvtN7XriHTUhs7P3rHCwobRgRBdJxoio0N7rDoc4vhiAlC1pW2QdgkSu62VZK1Hf2aI=s1280";
const defaultImg2 = "https://blogger.googleusercontent.com/img/a/AVvXsEhZ4Fw8Xl52IHLZQRVn5u8z3UuTjlVkhKD6MLEIpJtwZj0ZFe3230Yfzaw5AAO_m406K4whQuP7Va_w8l16_JoT3Mbkw811x3kMHm_pKmzAvj44_19ICmPZQQAF430R6Awe0Vhgm-DHOgaWhoZf0o1Tl0lJwOC6JX5n1ZsgfBVgT5Qgmv4kd-DebHbyTiw=s1280";
let customBgDataUrl = null;

function getBgUrl() {
    let val = $('bgSelect').value;
    if(val === 'default1') return defaultImg1;
    if(val === 'default2') return defaultImg2;
    if(val === 'custom') return customBgDataUrl;
    return null;
}

$('themeToggle').onclick = () => {
    isLightMode = !isLightMode;
    document.body.classList.toggle('light-mode', isLightMode);
    $('themeToggle').innerText = isLightMode ? "☀️ Light Mode" : "🌙 Dark Mode";
    if(isLightMode && $('optColor').value === "#ffffff") $('optColor').value = "#000000";
    else if(!isLightMode && $('optColor').value === "#000000") $('optColor').value = "#ffffff";
    renderPreview();
};

$('bgSelect').onchange = (e) => {
    if(e.target.value === 'custom') $('bgImgUpload').style.display = 'block';
    else $('bgImgUpload').style.display = 'none';
    renderPreview(); 
};

$('bgImgUpload').onchange = (e) => {
    const reader = new FileReader();
    reader.onload = () => { customBgDataUrl = reader.result; renderPreview(); };
    if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
};

// Buttons
$('importBtn').onclick = () => { 
    try { 
        DATA = JSON.parse($('jsonArea').value); 
        if(!Array.isArray(DATA)) DATA = [DATA];
        $('jsonArea').value = JSON.stringify(DATA, null, 2);
        renderPreview(); 
    } catch (e) { alert("Invalid JSON Code!"); } 
};

$('appendBtn').onclick = () => { 
    try { 
        if(!$('jsonArea').value.trim()) return alert("Please paste new JSON to append.");
        let newData = JSON.parse($('jsonArea').value); 
        if(!Array.isArray(newData)) newData = [newData];
        DATA = DATA.concat(newData); 
        $('jsonArea').value = JSON.stringify(DATA, null, 2); 
        renderPreview(); 
        const btn = $('appendBtn'); btn.innerHTML = "✅ Appended!"; setTimeout(() => btn.innerHTML = "➕ Append JSON", 2000);
    } catch (e) { alert("Invalid JSON Code!"); } 
};

$('copyBtn').onclick = () => {
    if (DATA.length === 0) return alert("No data to copy!");
    $('jsonArea').value = JSON.stringify(DATA, null, 2);
    navigator.clipboard.writeText($('jsonArea').value).then(() => {
        const btn = $('copyBtn'); btn.innerHTML = "✅ Copied!"; setTimeout(() => btn.innerHTML = "📋 Copy JSON", 2000);
    });
};

$('clearBtn').onclick = () => { if(confirm("Clear all slides?")) { DATA = []; $('jsonArea').value = ""; renderPreview(); } };

function formatPreviewText(text, boldHex) {
    if(!text) return ""; return text.replace(/<b>(.*?)<\/b>/g, `<span style="color:${boldHex}; font-weight:bold;">$1</span>`);
}

// Clean HTML Preview
function renderPreview() {
    const box = $("preview"); box.innerHTML = "";
    if(DATA.length === 0) { box.innerHTML = "<p style='color:var(--text-muted); padding:20px; text-align:center;'>No data. Paste JSON and Import/Append.</p>"; return; }

    const h1c = $('h1Color').value, h2c = $('h2Color').value, h3c = $('h3Color').value, bc = $('boldColor').value, oc = $('optColor').value;
    const bgUrl = getBgUrl();
    let lastH1Preview = null; 

    DATA.forEach((item, idx) => {
        const div = document.createElement("div"); div.className = "slide-card";
        if(bgUrl) {
            div.style.background = `url('${bgUrl}') center/cover no-repeat`; 
        } else {
            div.style.backgroundColor = isLightMode ? "#ffffff" : "#000000";
        }

        const contentWrap = document.createElement("div"); contentWrap.className = "slide-content";
        
        // Text Elements
        Object.keys(item).forEach(key => {
            if(key === 'image' || key === 'imgPos') return; // Ignore old keys
            const el = document.createElement("div"); el.contentEditable = "true";
            
            if(key === 'h1') { 
                if (item.h1 === lastH1Preview) { el.className = "p-h1 h1-continued"; el.style.color = h1c; } 
                else { el.className = "p-h1"; el.style.color = h1c; lastH1Preview = item.h1; }
                el.innerText = item.h1; el.onblur = e => { DATA[idx].h1 = e.target.innerText; }; contentWrap.appendChild(el);
            }
            else if(key === 'h2') { el.className = "p-h2"; el.innerText = item.h2; el.style.color = h2c; el.onblur = e => { DATA[idx].h2 = e.target.innerText; }; contentWrap.appendChild(el); }
            else if(key === 'h3') { el.className = "p-h3"; el.innerText = item.h3; el.style.color = h3c; el.onblur = e => { DATA[idx].h3 = e.target.innerText; }; contentWrap.appendChild(el); }
            else if(key === 'content') { el.className = "p-text"; el.innerHTML = formatPreviewText(item.content, bc); el.style.color = oc; el.onblur = e => { DATA[idx].content = e.target.innerText; }; contentWrap.appendChild(el); }
            else if(key === 'list') {
                item.list.forEach((li, lIdx) => { const l = document.createElement("div"); l.className = "p-li"; l.contentEditable = "true"; l.style.color = oc; l.innerHTML = "• " + formatPreviewText(li, bc); l.onblur = e => { DATA[idx].list[lIdx] = e.target.innerText.replace("• ", ""); }; contentWrap.appendChild(l); });
            }
            else if(key === 'question') {
                const q = document.createElement("div"); q.className = "p-q"; q.contentEditable = "true"; q.style.color = h1c; q.innerHTML = "Q. " + formatPreviewText(item.question, bc); q.onblur = e => { DATA[idx].question = e.target.innerText.replace(/^Q\.\s*/, ""); }; contentWrap.appendChild(q);
                let opts = item.option || item.options || [];
                opts.forEach((o, oIdx) => { const op = document.createElement("div"); op.className = "p-text"; op.style.marginLeft = "20px"; op.contentEditable = "true"; op.style.color = oc; op.innerHTML = `${oIdx + 1}. ` + formatPreviewText(o, bc); op.onblur = e => { let val = e.target.innerText.replace(/^\d+\.\s*/, ''); if(item.option) DATA[idx].option[oIdx] = val; else DATA[idx].options[oIdx] = val; }; contentWrap.appendChild(op); });
            }
        });

        // Simple Image Box at the Bottom
        const imgBox = document.createElement("div"); imgBox.className = "image-placeholder-box";
        const fileIn = document.createElement("input"); fileIn.type = "file"; fileIn.accept = "image/*"; fileIn.style.display = "none";
        fileIn.onchange = (e) => { const reader = new FileReader(); reader.onload = () => { DATA[idx].image = reader.result; renderPreview(); }; if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]); };
        imgBox.onclick = () => fileIn.click();

        if(item.image) {
            const img = document.createElement("img"); img.src = item.image; imgBox.appendChild(img);
            const rmBtn = document.createElement("button"); rmBtn.className = "remove-img-btn"; rmBtn.innerText = "✖ Remove Image";
            rmBtn.onclick = (e) => { e.stopPropagation(); delete DATA[idx].image; renderPreview(); };
            imgBox.appendChild(rmBtn);
        } else { imgBox.innerHTML = "<span>🖼️ Click to Add Image to this Slide</span>"; }

        contentWrap.appendChild(imgBox);
        contentWrap.appendChild(fileIn);
        div.appendChild(contentWrap); box.appendChild(div);
    });
}

// Straightforward PPTX Generation
$('generateBtn').onclick = async () => {
    if (DATA.length === 0) return alert("No Data! Please import JSON first.");
    const btn = $('generateBtn'); btn.innerHTML = "⏳ Generating PPTX... Please wait"; btn.disabled = true;

    setTimeout(async () => {
        const pxW = 1300, pxH = 710;
        const m = { top:parseInt($('topM').value), bottom:parseInt($('bottomM').value), left:parseInt($('leftM').value), right:parseInt($('rightM').value) };
        const ppt = new PptxGenJS(); ppt.defineLayout({ name:"S", width:pxW/96, height:pxH/96 }); ppt.layout = "S";

        let lastH1PPT = null;

        for (const item of DATA) {
            let s = ppt.addSlide();
            const c = document.createElement("canvas"); c.width = pxW; c.height = pxH; const ctx = c.getContext("2d");
            ctx.textBaseline = "top"; 

            await document.fonts.load("30px Kalam"); await document.fonts.load("bold 30px Kalam"); 
            await document.fonts.load("bold 34px Kalam"); await document.fonts.load("bold 44px Kalam");

            let bgUrl = getBgUrl();
            if (bgUrl) {
                try {
                    let img = new Image(); 
                    img.crossOrigin = "Anonymous";
                    img.src = bgUrl; 
                    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; }); 
                    ctx.drawImage(img, 0, 0, pxW, pxH);
                } catch(e) {
                    ctx.fillStyle = isLightMode ? "#ffffff" : "#000000"; ctx.fillRect(0, 0, pxW, pxH);
                }
            } else { ctx.fillStyle = isLightMode ? "#ffffff" : "#000000"; ctx.fillRect(0, 0, pxW, pxH); }

            let y = m.top; const maxW = pxW - m.left - m.right;
            const h1c = $('h1Color').value, h2c = $('h2Color').value, h3c = $('h3Color').value, bc = $('boldColor').value, oc = $('optColor').value;

            const drawSmartText = (text, normalFont, boldFont, normalCol, boldCol, lineH, leftIndent = 0) => {
                const paras = text.split("\n");
                paras.forEach(para => {
                    if(!para) { y += lineH; return; }
                    let parts = para.split(/(<b>.*?<\/b>)/g);
                    let words = [];
                    parts.forEach(part => {
                        if(part.startsWith('<b>') && part.endsWith('</b>')) {
                            part.slice(3, -4).split(' ').forEach(w => { if(w) words.push({t: w, b: true}); });
                        } else {
                            part.split(' ').forEach(w => { if(w) words.push({t: w, b: false}); });
                        }
                    });

                    let currentX = m.left + leftIndent;
                    let endX = pxW - m.right;
                    
                    for(let i=0; i<words.length; i++) {
                        let w = words[i];
                        ctx.font = w.b ? boldFont : normalFont; ctx.fillStyle = w.b ? boldCol : normalCol;
                        let metric = ctx.measureText(w.t + " ");
                        
                        // Simple wrap logic
                        if (currentX + metric.width > endX && currentX !== m.left + leftIndent) {
                            y += lineH; currentX = m.left + leftIndent;
                        }
                        ctx.fillText(w.t + " ", currentX, y); currentX += metric.width;
                    }
                    y += lineH;
                });
            };

            Object.keys(item).forEach(key => {
                if(key === 'image' || key === 'imgPos') return;
                if(key==='h1'){ 
                    if (item.h1 !== lastH1PPT) { 
                        drawSmartText(item.h1, "bold 44px Kalam", "bold 44px Kalam", h1c, h1c, 56); 
                        ctx.beginPath(); ctx.moveTo(m.left, y - 5); ctx.lineTo(pxW - m.right, y - 5);
                        ctx.strokeStyle = "rgba(150,150,150,0.4)"; ctx.lineWidth = 2; ctx.stroke();
                        y+=15; lastH1PPT = item.h1; 
                    }
                }
                else if(key==='h2'){ drawSmartText(item.h2, "bold 34px Kalam", "bold 34px Kalam", h2c, h2c, 46); y+=5; }
                else if(key==='h3'){ drawSmartText(item.h3, "bold 28px Kalam", "bold 28px Kalam", h3c, h3c, 38); y+=5; }
                else if(key==='content'){ drawSmartText(item.content, "30px Kalam", "bold 30px Kalam", oc, bc, 42); y+=5; }
                else if(key==='list'){ item.list.forEach(li => drawSmartText("• " + li, "30px Kalam", "bold 30px Kalam", oc, bc, 42)); y+=5; }
                else if(key==='question'){ 
                    drawSmartText("Q. " + item.question, "bold 44px Kalam", "bold 44px Kalam", h1c, h1c, 50); y+=10;
                    let opts = item.option || item.options || []; 
                    opts.forEach((o, i) => { drawSmartText(`${i+1}. ${o}`, "30px Kalam", "bold 30px Kalam", oc, bc, 42, 20); });
                }
            });

            // Draw image exactly at the bottom center of the remaining space
            if (item.image) {
                let simg = new Image(); simg.src = item.image; await new Promise(r => simg.onload = r);
                let availableH = pxH - m.bottom - y;
                if(availableH > 50) { 
                    let ratio = Math.min(maxW / simg.width, availableH / simg.height);
                    let finalW = simg.width * ratio; let finalH = simg.height * ratio;
                    let x = m.left + (maxW - finalW) / 2; 
                    let imgY = y + (availableH - finalH) / 2;
                    ctx.drawImage(simg, x, imgY, finalW, finalH);
                }
            }
            s.addImage({ data:c.toDataURL("image/png"), x:0, y:0, w:pxW/96, h:pxH/96 });
        }
        ppt.writeFile({ fileName: "Study_Notes.pptx" }).then(() => { btn.innerHTML = "✅ Download Successful!"; setTimeout(()=>btn.innerHTML="💾 Generate PPTX File", 3000); btn.disabled = false; });
    }, 100);
};
</script>
