<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Kalam Font PPT Maker</title>

<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.9.0/dist/pptxgen.bundle.min.js"></script>

<style>
:root { --accent: #0b74ff; --bg: #0f1720; --card: #161f2c; --text: #eee; }
body{ font-family: 'Kalam', cursive; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
.container { max-width: 1200px; margin: auto; }
.header { text-align: center; margin-bottom: 20px; color: var(--accent); }
.card{ background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #223; }
label{ color: #9fb7ff; font-weight: 700; margin-top: 12px; display: block; }
textarea, input { 
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334; 
    background: #0b1220; color: #fff; font-family: 'Kalam', cursive; margin-top: 5px; box-sizing: border-box;
}
.btn-row { display: flex; gap: 10px; margin-top: 15px; }
.btn{ flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Kalam', cursive; font-weight: 700; transition: 0.3s; }
.btn-blue{ background: var(--accent); color: #fff; }
.btn-red{ background: #e11d48; color: #fff; }
.btn-grey{ background: #334155; color: #fff; }

.preview-container { background: #071019; border-radius: 10px; border: 1px solid #203040; height: 600px; overflow-y: auto; padding: 15px; }
.slide-card { background: #000; border: 1px solid #444; margin-bottom: 15px; padding: 15px; border-radius: 8px; font-family: 'Kalam', cursive; }
.preview-h1 { color: var(--accent); font-weight: bold; font-size: 1.2em; border-bottom: 1px solid #222; margin-bottom: 5px; }
.preview-p { color: #ccc; font-size: 0.9em; white-space: pre-wrap; }
.preview-q { color: #ffff00; margin-top: 10px; font-weight: bold; }

.row { display: flex; flex-wrap: wrap; gap: 15px; }
.col { flex: 1; min-width: 300px; }
.num-input { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>

<body>

<div class="container">
    <div class="header"><h1>Kalam Font PPTX (Notes + Quiz)</h1></div>

    <div class="row">
        <div class="col card">
            <label>JSON Input</label>
            <textarea id="jsonArea" rows="10" placeholder='[{"h1":"शीर्षक", "content":"यहाँ नोट्स लिखें...", "question":"सवाल?", "option":["A","B"]}]'></textarea>
            
            <div class="btn-row">
                <button id="importBtn" class="btn btn-grey">Import JSON</button>
                <button id="clearBtn" class="btn btn-red">Clear</button>
            </div>

            <div class="num-input" style="margin-top:15px;">
                <div><label>Top</label><input type="number" id="topM" value="80"></div>
                <div><label>Left</label><input type="number" id="leftM" value="80"></div>
                <div><label>Q Color</label><input type="color" id="qColor" value="#ffff00"></div>
                <div><label>Text Color</label><input type="color" id="optColor" value="#ffffff"></div>
            </div>

            <label>Background Image</label>
            <input type="file" id="bgImg" accept="image/*">

            <button id="generateBtn" class="btn btn-blue" style="margin-top:20px; width:100%;">Download PPTX</button>
        </div>

        <div class="col">
            <label>Data Preview</label>
            <div id="preview" class="preview-container"></div>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
let DATA = [];
let BG = null;

// Drawing context
const calcCanvas = document.createElement("canvas");
const calcCtx = calcCanvas.getContext("2d");

function getWrappedHeight(text, font, maxW, lineH) {
    calcCtx.font = font;
    const words = text.split(" ");
    let line = "";
    let linesCount = 0;
    for (let w of words) {
        let t = line + w + " ";
        if (calcCtx.measureText(t).width > maxW && line !== "") {
            linesCount++;
            line = w + " ";
        } else line = t;
    }
    linesCount++; 
    return linesCount * lineH;
}

async function createSlidesFromData(item, pxW, pxH, m) {
    const slides = [];
    let currentLines = [];
    let currentY = m.top;
    const maxW = pxW - m.left - (parseInt($('leftM').value) || 80); // Using Left margin for right too
    const maxY = pxH - 60; // Bottom buffer

    const addLine = (text, type) => {
        const font = (type === 'h1' || type === 'q') ? "bold 40px Kalam" : "30px Kalam";
        const lineH = (type === 'h1' || type === 'q') ? 50 : 40;
        const neededH = getWrappedHeight(text, font, maxW, lineH) + 10;

        if (currentY + neededH > maxY && currentLines.length > 0) {
            slides.push([...currentLines]);
            currentLines = [];
            currentY = m.top;
        }
        currentLines.push({ text, type, font, lineH });
        currentY += neededH;
    };

    if (item.h1) addLine(item.h1.toUpperCase(), 'h1');
    if (item.content) item.content.split('\n').forEach(l => addLine(l, 'p'));
    if (item.list) item.list.forEach(l => addLine("• " + l, 'li'));
    if (currentLines.length > 0) slides.push([...currentLines]);

    if (item.question) {
        let quizLines = [];
        quizLines.push({ text: "Q. " + item.question, type: 'q', font: "bold 38px Kalam", lineH: 48 });
        let opts = item.option || item.options || [];
        opts.forEach((o, idx) => {
            if (o) quizLines.push({ text: `${idx + 1}. ${o}`, type: 'o', font: "30px Kalam", lineH: 40 });
        });
        slides.push(quizLines);
    }
    return slides;
}

function renderPreview() {
    const box = $("preview");
    box.innerHTML = "";
    DATA.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "slide-card";
        let html = `<div style="font-size:12px; color:#555">Item ${idx+1}</div>`;
        if(item.h1) html += `<div class="preview-h1">${item.h1}</div>`;
        if(item.content) html += `<div class="preview-p">${item.content.substring(0,100)}...</div>`;
        if(item.question) html += `<div class="preview-q">Q: ${item.question}</div>`;
        div.innerHTML = html;
        box.appendChild(div);
    });
}

async function drawSlideImage(lines, pxW, pxH, m, qc, oc) {
    const c = document.createElement("canvas");
    c.width = pxW; c.height = pxH;
    const ctx = c.getContext("2d");

    // Force Kalam Load before Drawing
    await document.fonts.load("30px Kalam");

    if (BG) {
        let img = new Image(); img.src = BG;
        await new Promise(r => img.onload = r);
        ctx.drawImage(img, 0, 0, pxW, pxH);
    } else {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, pxW, pxH);
    }

    let y = m.top;
    const maxW = pxW - m.left * 2;

    lines.forEach(line => {
        ctx.fillStyle = (line.type === 'h1' || line.type === 'q') ? qc : oc;
        ctx.font = line.font;
        
        const words = line.text.split(" ");
        let currentLine = "";
        for (let w of words) {
            let t = currentLine + w + " ";
            if (ctx.measureText(t).width > maxW && currentLine !== "") {
                ctx.fillText(currentLine, m.left, y); y += line.lineH; currentLine = w + " ";
            } else currentLine = t;
        }
        ctx.fillText(currentLine, m.left, y);
        y += line.lineH + 10;
    });
    return c.toDataURL("image/png");
}

$('importBtn').onclick = () => {
    try {
        const raw = JSON.parse($('jsonArea').value);
        DATA = Array.isArray(raw) ? raw : [raw];
        renderPreview();
    } catch (e) { alert("JSON Error!"); }
};

$('generateBtn').onclick = async () => {
    if (DATA.length === 0) return alert("No Data!");
    const pxW = 1300, pxH = 710;
    const m = { top: parseInt($('topM').value), left: parseInt($('leftM').value) };
    const ppt = new PptxGenJS();
    ppt.defineLayout({ name: "A", width: pxW/96, height: pxH/96 });
    ppt.layout = "A";

    for (const item of DATA) {
        const slides = await createSlidesFromData(item, pxW, pxH, m);
        for (const lines of slides) {
            const img = await drawSlideImage(lines, pxW, pxH, m, $('qColor').value, $('optColor').value);
            let slide = ppt.addSlide();
            slide.addImage({ data: img, x: 0, y: 0, w: pxW/96, h: pxH/96 });
        }
    }
    ppt.writeFile({ fileName: "Study_Notes.pptx" });
};

$('bgImg').onchange = (e) => {
    const reader = new FileReader();
    reader.onload = () => BG = reader.result;
    reader.readAsDataURL(e.target.files[0]);
};

$('clearBtn').onclick = () => { DATA = []; $('jsonArea').value = ""; renderPreview(); };
</script>

</body>
</html>
