<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MCQ/Notes PPT Generator (Editable)</title>

<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.9.0/dist/pptxgen.bundle.min.js"></script>

<style>
:root { --accent: #ffeb3b; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: #334155; }
body{ font-family: 'Kalam', cursive; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
.container { max-width: 1300px; margin: auto; }
.card{ background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
label{ color: #94a3b8; font-weight: 700; margin-top: 10px; display: block; font-size: 0.9em; }
textarea, input { 
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); 
    background: #0f172a; color: #fff; font-family: 'Kalam', cursive; margin-top: 5px; box-sizing: border-box;
}
.btn-row { display: flex; gap: 10px; margin-top: 15px; }
.btn{ flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Kalam', cursive; font-weight: 700; transition: 0.2s; }
.btn-blue{ background: #2563eb; color: #fff; }
.btn-red{ background: #e11d48; color: #fff; }
.btn-grey{ background: #475569; color: #fff; }

.preview-container { background: #020617; border-radius: 10px; border: 1px solid var(--border); height: 680px; overflow-y: auto; padding: 15px; }
.slide-card { background: #000; border: 1px solid #334; margin-bottom: 15px; padding: 15px; border-radius: 8px; position: relative; }
.edit-hint { position: absolute; top: 5px; right: 10px; font-size: 10px; color: #475569; }

/* Editable Content Styles */
[contenteditable="true"] { outline: none; padding: 2px; border-radius: 4px; transition: 0.2s; }
[contenteditable="true"]:hover { background: #1e293b; }
[contenteditable="true"]:focus { background: #1e293b; border: 1px dashed var(--accent); }

.preview-h1 { color: var(--accent); font-weight: bold; font-size: 1.4em; border-bottom: 1px solid #333; margin-bottom: 10px; }
.preview-content { color: #fff; white-space: pre-wrap; font-size: 1.1em; margin: 10px 0; }
.preview-q-box { color: var(--accent); font-weight: bold; margin-top: 15px; border-top: 1px dashed #333; padding-top: 10px; }
.preview-opt { color: #fff; font-size: 1em; margin-left: 15px; }

.row { display: flex; flex-wrap: wrap; gap: 20px; }
.col { flex: 1; min-width: 350px; }
.margin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>

<body>

<div class="container">
    <div class="row">
        <div class="col card">
            <h2 style="margin:0 0 15px 0; color:var(--accent)">PPT Settings</h2>
            <label>JSON Input</label>
            <textarea id="jsonArea" rows="8" placeholder="यहाँ JSON पेस्ट करें..."></textarea>
            
            <div class="btn-row">
                <button id="importBtn" class="btn btn-grey">Import & Preview</button>
                <button id="clearBtn" class="btn btn-red">Clear All</button>
            </div>

            <label>Margins (Pixels)</label>
            <div class="margin-grid">
                <div><label>Top</label><input type="number" id="topM" value="90"></div>
                <div><label>Bottom</label><input type="number" id="bottomM" value="60"></div>
                <div><label>Left</label><input type="number" id="leftM" value="90"></div>
                <div><label>Right</label><input type="number" id="rightM" value="90"></div>
            </div>

            <div class="margin-grid">
                <div><label>Question/H1 Color</label><input type="color" id="qColor" value="#ffff00"></div>
                <div><label>Content Color</label><input type="color" id="optColor" value="#ffffff"></div>
            </div>

            <label>Background Image (Optional)</label>
            <input type="file" id="bgImg" accept="image/*">

            <button id="generateBtn" class="btn btn-blue" style="margin-top:20px; width:100%; font-size:1.2em;">Download Black PPTX</button>
        </div>

        <div class="col">
            <label>Live Preview (Click to Edit)</label>
            <div id="preview" class="preview-container">
                <div style="text-align:center; color:#475569; margin-top:50px;">डेटा लोड होने पर यहाँ दिखाई देगा...</div>
            </div>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
let DATA = [];
let BG = null;

const calcCanvas = document.createElement("canvas");
const calcCtx = calcCanvas.getContext("2d");

function getWrappedHeight(text, font, maxW, lineH) {
    calcCtx.font = font;
    const words = text.split(" ");
    let line = "";
    let linesCount = 0;
    for (let w of words) {
        let t = line + w + " ";
        if (calcCtx.measureText(t).width > maxW && line !== "") {
            linesCount++;
            line = w + " ";
        } else line = t;
    }
    linesCount++; 
    return linesCount * lineH;
}

// Render Data and allow live editing
function renderPreview() {
    const box = $("preview");
    box.innerHTML = "";
    DATA.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "slide-card";
        div.innerHTML = `<span class="edit-hint">Click to edit</span>`;
        
        if(item.h1) {
            const h1El = document.createElement("div");
            h1El.className = "preview-h1";
            h1El.contentEditable = "true";
            h1El.innerText = item.h1;
            h1El.onblur = (e) => DATA[idx].h1 = e.target.innerText;
            div.appendChild(h1El);
        }

        if(item.content) {
            const pEl = document.createElement("div");
            pEl.className = "preview-content";
            pEl.contentEditable = "true";
            pEl.innerText = item.content;
            pEl.onblur = (e) => DATA[idx].content = e.target.innerText;
            div.appendChild(pEl);
        }

        if(item.list) {
            item.list.forEach((li, liIdx) => {
                const liEl = document.createElement("div");
                liEl.style.color = "#ccc";
                liEl.contentEditable = "true";
                liEl.innerText = "• " + li;
                liEl.onblur = (e) => DATA[idx].list[liIdx] = e.target.innerText.replace("• ", "");
                div.appendChild(liEl);
            });
        }

        if(item.question) {
            const qEl = document.createElement("div");
            qEl.className = "preview-q-box";
            qEl.contentEditable = "true";
            qEl.innerText = "Q: " + item.question;
            qEl.onblur = (e) => DATA[idx].question = e.target.innerText.replace("Q: ", "");
            div.appendChild(qEl);

            let opts = item.option || item.options || [];
            opts.forEach((o, oIdx) => {
                const oEl = document.createElement("div");
                oEl.className = "preview-opt";
                oEl.contentEditable = "true";
                oEl.innerText = `${oIdx + 1}. ${o}`;
                oEl.onblur = (e) => {
                    let clean = e.target.innerText.replace(/^\d+\.\s*/, "");
                    if(DATA[idx].option) DATA[idx].option[oIdx] = clean;
                    else DATA[idx].options[oIdx] = clean;
                };
                div.appendChild(oEl);
            });
        }
        box.appendChild(div);
    });
}

async function createSlidesFromData(item, pxW, pxH, m) {
    const slides = [];
    let currentLines = [];
    let currentY = m.top;
    const maxW = pxW - m.left - m.right;
    const maxY = pxH - m.bottom;

    const addLine = (text, type) => {
        const font = (type === 'h1' || type === 'q') ? "bold 40px Kalam" : "30px Kalam";
        const lineH = (type === 'h1' || type === 'q') ? 52 : 42;
        const neededH = getWrappedHeight(text, font, maxW, lineH) + 12;

        if (currentY + neededH > maxY && currentLines.length > 0) {
            slides.push([...currentLines]);
            currentLines = [];
            currentY = m.top;
        }
        currentLines.push({ text, type, font, lineH });
        currentY += neededH;
    };

    if (item.h1) addLine(item.h1.toUpperCase(), 'h1');
    if (item.content) item.content.split('\n').forEach(l => addLine(l, 'p'));
    if (item.list) item.list.forEach(l => addLine("• " + l, 'li'));
    if (currentLines.length > 0) slides.push([...currentLines]);

    if (item.question) {
        let quizLines = [];
        quizLines.push({ text: "Q. " + item.question, type: 'q', font: "bold 38px Kalam", lineH: 50 });
        let opts = item.option || item.options || [];
        opts.forEach((o, idx) => {
            if (o) quizLines.push({ text: `${idx + 1}. ${o}`, type: 'o', font: "30px Kalam", lineH: 42 });
        });
        slides.push(quizLines);
    }
    return slides;
}

async function drawSlideImage(lines, pxW, pxH, m, qc, oc) {
    const c = document.createElement("canvas");
    c.width = pxW; c.height = pxH;
    const ctx = c.getContext("2d");
    await document.fonts.load("30px Kalam");

    if (BG) {
        let img = new Image(); img.src = BG;
        await new Promise(r => img.onload = r);
        ctx.drawImage(img, 0, 0, pxW, pxH);
    } else {
        ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, pxW, pxH);
    }

    let y = m.top;
    const maxW = pxW - m.left - m.right;

    lines.forEach(line => {
        ctx.fillStyle = (line.type === 'h1' || line.type === 'q') ? qc : oc;
        ctx.font = line.font;
        const words = line.text.split(" ");
        let currentLine = "";
        for (let w of words) {
            let t = currentLine + w + " ";
            if (ctx.measureText(t).width > maxW && currentLine !== "") {
                ctx.fillText(currentLine, m.left, y); y += line.lineH; currentLine = w + " ";
            } else currentLine = t;
        }
        ctx.fillText(currentLine, m.left, y);
        y += line.lineH + 10;
    });
    return c.toDataURL("image/png");
}

$('importBtn').onclick = () => {
    try {
        const raw = JSON.parse($('jsonArea').value);
        DATA = Array.isArray(raw) ? raw : [raw];
        renderPreview();
    } catch (e) { alert("JSON Format Error!"); }
};

$('generateBtn').onclick = async () => {
    if (DATA.length === 0) return alert("Please import JSON first!");
    const pxW = 1300, pxH = 710;
    const m = { 
        top: parseInt($('topM').value), bottom: parseInt($('bottomM').value), 
        left: parseInt($('leftM').value), right: parseInt($('rightM').value) 
    };
    const ppt = new PptxGenJS();
    ppt.defineLayout({ name: "A", width: pxW/96, height: pxH/96 });
    ppt.layout = "A";

    for (const item of DATA) {
        const slides = await createSlidesFromData(item, pxW, pxH, m);
        for (const lines of slides) {
            const img = await drawSlideImage(lines, pxW, pxH, m, $('qColor').value, $('optColor').value);
            let slide = ppt.addSlide();
            slide.addImage({ data: img, x: 0, y: 0, w: pxW/96, h: pxH/96 });
        }
    }
    ppt.writeFile({ fileName: "Dark_Presentation.pptx" });
};

$('bgImg').onchange = (e) => {
    const reader = new FileReader();
    reader.onload = () => BG = reader.result;
    reader.readAsDataURL(e.target.files[0]);
};

$('clearBtn').onclick = () => { DATA = []; $('jsonArea').value = ""; renderPreview(); };
</script>

</body>
</html>
